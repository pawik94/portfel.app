<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b3a67">
<title>Portfel</title>
<style>
:root{--bg:#eceff3;--card:#fff;--tx:#18202c;--mu:#5d6878;--ac:#2b3a67;--ac2:#e8ebf5;--bd:#d9dee6;--bad:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#10141b;--card:#1a212b;--tx:#e7ebf1;--mu:#9aa5b5;--ac:#9fb1f0;--ac2:#232c3d;--bd:#2a3340;--bad:#f97066}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 calc(68px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 6px;max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0}
.st{font-size:12px;color:var(--mu);padding:0 16px 8px;max-width:720px;margin:0 auto}
main{max-width:720px;margin:0 auto;padding:8px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.mu{color:var(--mu);font-size:14px}.bad{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.row b{font-variant-numeric:tabular-nums;text-align:right}
button,input,select{font:inherit;color:inherit}
button{background:var(--ac);color:var(--card);border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bd)}
input,select{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{width:100%;text-align:left;background:transparent;color:var(--tx);border-radius:0;padding:10px 0;border-top:1px solid var(--bd);display:flex;justify-content:space-between;gap:10px}
.item:first-child{border-top:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:transparent;color:var(--mu);border-radius:0;padding:14px 2px;font-size:13px}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 2px 0 var(--ac)}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBSJNAmWuu4SGu1D25rkJrrn6L0CzOmKds",
  authDomain:"portfel-7c77f.firebaseapp.com",
  projectId:"portfel-7c77f",
  storageBucket:"portfel-7c77f.firebasestorage.app",
  messagingSenderId:"954590394780",
  appId:"1:954590394780:web:0b635ea8a6bf48409bf059"
};
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRmNNUaIptQmyWUjvLpJf6oeRlft0DVEbXqoXA0CzfowQizt9uNzR4WFDZT1qW0YCuG9-6RLune9e1C/pub?gid=0&single=true&output=csv";
const EMAIL="portfel.app@portfel.pl";
const OWNERS=["Kuba","Żona","Wspólne"];

const auth=getAuth(initializeApp(firebaseConfig));
const db=getFirestore(auth.app);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=s=>{const n=parseFloat(String(s).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:NaN};
const money=(v,c)=>{try{return new Intl.NumberFormat("pl-PL",{style:"currency",currency:c}).format(v)}catch(e){return v.toFixed(2)+" "+c}};

let user=null,S={accounts:[],pf:[],tx:[]},tab="all",editId=null,err="",loginErr="",rates={PLN:1},quotes={},info="",unsub=null,booted=false;

function parseCsv(t){const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==","){r.push(f);f=""}
    else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);rows.push(r);r=[];f=""}
    else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}return rows}

function applyRows(rows){rates={PLN:1};quotes={};
  for(const [s,k,w] of rows){if(!s)continue;
    const m=s.match(/^CURRENCY:([A-Z]{3})PLN$/);
    if(m){const n=num(k);if(n>0)rates[m[1]]=n}
    else quotes[s]={price:num(k),fx:num(w)}}}

async function loadRates(){
  try{const res=await fetch(CSV_URL,{cache:"no-store"});if(!res.ok)throw new Error("http");
    const rows=parseCsv(await res.text()).slice(1);applyRows(rows);
    localStorage.setItem("rows",JSON.stringify({t:Date.now(),rows}));
    info="Kursy pobrane: "+new Date().toLocaleString("pl-PL")}
  catch(e){try{const c=JSON.parse(localStorage.getItem("rows"));applyRows(c.rows);
      info="Nie udało się pobrać kursów, pokazuję zapisane z "+new Date(c.t).toLocaleString("pl-PL")}
    catch(_){info="Brak kursów: nie udało się pobrać arkusza"}}
  render()}

async function save(){
  try{await setDoc(doc(db,"data","state"),{accounts:S.accounts,pf:S.pf,tx:S.tx});err=""}
  catch(e){err="Nie zapisano: "+e.code}
  render()}

function totals(){let t=0;const by={},miss=new Set();
  OWNERS.forEach(o=>by[o]=0);
  for(const a of S.accounts){const r=rates[a.cur];
    if(!r){miss.add(a.cur);continue}
    const v=a.amount*r;t+=v;by[a.owner]=(by[a.owner]||0)+v}
  return{t,by,miss:[...miss]}}

function warn(tt){return tt.miss.length?`<p class="bad">Brak kursu do PLN dla: ${tt.miss.map(esc).join(", ")}. Te konta nie są wliczone. Dodaj w arkuszu wiersz CURRENCY:${esc(tt.miss[0])}PLN.</p>`:""}

function viewAll(){const tt=totals(),sk=stkTotals(),sv=tt.t;tt.t+=sk.pln;OWNERS.forEach(o=>tt.by[o]=(tt.by[o]||0)+(sk.by[o]||0));tt.miss=[...new Set([...tt.miss,...sk.miss])];
  return `<div class="card"><div class="mu">Razem</div><div class="big">${money(tt.t,"PLN")}</div>${warn(tt)}</div>
  <div class="card"><div class="mu">Kto ma</div>${OWNERS.map(o=>`<div class="row"><span>${o}</span><b>${money(tt.by[o]||0,"PLN")}</b></div>`).join("")}</div>
  <div class="card"><div class="mu">Działy</div>
   <div class="row"><span>Oszczędności i konta</span><b>${money(sv,"PLN")}</b></div>
   <div class="row"><span>Akcje</span><b>${money(sk.pln,"PLN")}</b></div>
   <div class="row"><span>Obligacje</span><b class="mu">wkrótce</b></div>
   <div class="row"><span>PPK</span><b class="mu">wkrótce</b></div></div>`}

function viewSav(){const tt=totals();
  const a=S.accounts.find(x=>x.id===editId)||{name:"",owner:OWNERS[0],cur:"PLN",amount:""};
  const list=S.accounts.length?S.accounts.map(x=>{const r=rates[x.cur];
    return `<button class="item" data-edit="${esc(x.id)}"><span>${esc(x.name)}<br><span class="mu">${esc(x.owner)}</span></span><span style="text-align:right"><b>${money(x.amount,x.cur)}</b>${x.cur!=="PLN"&&r?`<br><span class="mu">≈ ${money(x.amount*r,"PLN")}</span>`:""}</span></button>`}).join(""):`<p class="mu">Nie ma jeszcze żadnych kont. Dodaj pierwsze poniżej.</p>`;
  return `<div class="card"><div class="mu">Suma w PLN</div><div class="big">${money(tt.t,"PLN")}</div>${warn(tt)}</div>
  <div class="card">${list}</div>
  <div class="card"><b>${editId?"Edytuj konto":"Dodaj konto"}</b>
   <label>Nazwa (np. Revolut, ING oszczędnościowe)</label><input id="f-name" value="${esc(a.name)}">
   <div class="g2"><div><label>Właściciel</label><select id="f-owner">${OWNERS.map(o=>`<option${o===a.owner?" selected":""}>${o}</option>`).join("")}</select></div>
   <div><label>Waluta</label><select id="f-cur">${[...new Set(["PLN","EUR","USD","GBP","CHF","CZK","SEK","NOK","DKK","HUF","CAD","AUD","JPY",a.cur])].map(c=>`<option${c===a.cur?" selected":""}>${c}</option>`).join("")}</select></div></div>
   <label>Saldo</label><input id="f-amount" inputmode="decimal" value="${a.amount===""?"":String(a.amount).replace(".",",")}">
   <div class="g2"><button data-save>Zapisz konto</button>${editId?`<button class="ghost" data-cancel>Anuluj</button>`:"<span></span>"}</div>
   ${editId?`<p><button class="danger" data-del>Usuń to konto</button></p>`:""}</div>`}

const CURS=["PLN","EUR","USD","GBP","CHF","CZK","SEK","NOK","DKK","HUF","CAD","AUD","JPY"];
let pid="all",txEdit=null;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const pct=v=>isFinite(v)?(v>=0?"+":"")+(v*100).toFixed(2).replace(".",",")+" %":"–";
const sg=(v,c)=>`<span class="${v<0?"bad":""}">${v>0?"+":""}${money(v,c)}</span>`;
const fq=n=>String(Math.round(n*1e6)/1e6).replace(".",",");
const TL={buy:"Zakup",sell:"Sprzedaż",div:"Dywidenda",fee:"Opłata"};

function calc(p){const pos={};let fees=0,divs=0,buys=0,realized=0;
  const txs=S.tx.filter(t=>t.pid===p.id).sort((a,b)=>a.date===b.date?(a.id<b.id?-1:1):(a.date<b.date?-1:1));
  for(const t of txs){
    if(!t.sym){fees+=t.amount||0;continue}
    const P=pos[t.sym]||(pos[t.sym]={sym:t.sym,qty:0,cost:0});
    if(t.type==="buy"){const c=t.qty*t.price+(t.fee||0);P.qty+=t.qty;P.cost+=c;buys+=c}
    else if(t.type==="sell"){const avg=P.qty>0?P.cost/P.qty:0;realized+=t.qty*t.price-(t.fee||0)-t.qty*avg;P.cost-=t.qty*avg;P.qty-=t.qty}
    else if(t.type==="div")divs+=t.amount||0;
    else if(t.type==="fee")fees+=t.amount||0}
  const open=[],miss=[],neg=[];let value=0,unreal=0;
  for(const P of Object.values(pos)){if(Math.abs(P.qty)<1e-9)continue;
    if(P.qty<0)neg.push(P.sym);
    const q=quotes[P.sym],pr=q&&q.price>0?q.price:NaN;P.avg=P.qty?P.cost/P.qty:0;P.price=pr;
    if(isNaN(pr))miss.push(P.sym);else{P.value=P.qty*pr;P.gain=P.value-P.cost;value+=P.value;unreal+=P.gain}
    open.push(P)}
  const gain=unreal+realized+divs-fees;
  const f=rates[p.cur]||open.map(x=>quotes[x.sym]&&quotes[x.sym].fx).find(v=>v>0);
  return{open,miss,neg,value,unreal,realized,divs,fees,gain,buys,ret:buys>0?gain/buys:NaN,f}}

function stkTotals(){let pln=0;const by={},miss=new Set();
  for(const p of S.pf){const c=calc(p);if(!c.f){miss.add(p.cur);continue}
    pln+=c.value*c.f;by[p.owner]=(by[p.owner]||0)+c.value*c.f}
  return{pln,by,miss:[...miss]}}

function stkAll(){let h="",pln=0,gain=0,buys=0;const miss=new Set();
  for(const p of S.pf){const c=calc(p);if(!c.f){miss.add(p.cur);continue}
    pln+=c.value*c.f;gain+=c.gain*c.f;buys+=c.buys*c.f;
    h+=`<button class="item" data-pfgo="${esc(p.id)}"><span>${esc(p.name)}<br><span class="mu">${esc(p.owner)}, ${esc(p.cur)}</span></span><span style="text-align:right"><b>${money(c.value*c.f,"PLN")}</b><br>${sg(c.gain*c.f,"PLN")} (${pct(c.ret)})</span></button>`}
  return `<div class="card"><div class="mu">Wszystkie portfele w PLN</div><div class="big">${money(pln,"PLN")}</div>
   <div class="row"><span>Wynik łącznie</span><b>${sg(gain,"PLN")} (${pct(buys>0?gain/buys:NaN)})</b></div>
   ${miss.size?`<p class="bad">Brak kursu do PLN dla: ${[...miss].map(esc).join(", ")}. Te portfele nie są wliczone.</p>`:""}</div><div class="card">${h}</div>`}

function viewStk(){
  if(!S.pf.length)pid="";else if(pid==="all"&&S.pf.length===1)pid=S.pf[0].id;else if(pid!=="all"&&!S.pf.find(p=>p.id===pid))pid="all";
  const sel=S.pf.length?`<select data-pfsel>${S.pf.length>1?`<option value="all"${pid==="all"?" selected":""}>Wszystkie portfele (w PLN)</option>`:""}${S.pf.map(p=>`<option value="${esc(p.id)}"${p.id===pid?" selected":""}>${esc(p.name)} (${esc(p.cur)})</option>`).join("")}</select>`:"";
  const newpf=`<div class="card"><b>Nowy portfel</b><label>Nazwa</label><input id="p-name" placeholder="np. IKE">
   <div class="g2"><div><label>Właściciel</label><select id="p-owner">${OWNERS.map(o=>`<option>${o}</option>`).join("")}</select></div>
   <div><label>Waluta portfela</label><select id="p-cur">${CURS.map(c=>`<option>${c}</option>`).join("")}</select></div></div>
   <button data-addpf>Dodaj portfel</button></div>`;
  if(!S.pf.length)return `<div class="card"><p class="mu">Nie ma jeszcze portfeli. Dodaj pierwszy, np. IKE w PLN albo portfel w USD.</p></div>`+newpf;
  if(pid==="all")return sel+stkAll()+newpf;
  const p=S.pf.find(x=>x.id===pid),c=calc(p),cur=p.cur;
  const head=`<div class="card"><div class="mu">Wartość portfela</div><div class="big">${money(c.value,cur)}</div>${cur!=="PLN"&&c.f?`<div class="mu">≈ ${money(c.value*c.f,"PLN")}</div>`:""}
   <div class="row"><span>Wynik łącznie</span><b>${sg(c.gain,cur)} (${pct(c.ret)})</b></div>
   <div class="row"><span>Niezrealizowany</span><b>${sg(c.unreal,cur)}</b></div>
   <div class="row"><span>Zrealizowany (sprzedaże)</span><b>${sg(c.realized,cur)}</b></div>
   <div class="row"><span>Dywidendy</span><b>${money(c.divs,cur)}</b></div>
   <div class="row"><span>Opłaty osobne</span><b>${money(c.fees,cur)}</b></div>
   ${c.miss.length?`<p class="bad">Brak kursu w arkuszu dla: ${c.miss.map(esc).join(", ")}. Te pozycje nie są wliczone do wartości ani wyniku.</p>`:""}
   ${c.neg.length?`<p class="bad">Sprzedano więcej niż kupiono: ${c.neg.map(esc).join(", ")}. Sprawdź historię ruchów.</p>`:""}</div>`;
  const pos=c.open.length?c.open.map(x=>`<div class="row"><span>${esc(x.sym)}<br><span class="mu">${fq(x.qty)} × śr. ${money(x.avg,cur)}</span></span><span style="text-align:right">${isNaN(x.price)?`<span class="mu">brak kursu</span>`:`<b>${money(x.value,cur)}</b><br>${sg(x.gain,cur)} (${pct(x.cost>0?x.gain/x.cost:NaN)})`}</span></div>`).join(""):`<p class="mu">Brak otwartych pozycji. Dodaj pierwszy zakup poniżej.</p>`;
  const hist=S.tx.filter(t=>t.pid===p.id).sort((a,b)=>a.date===b.date?(a.id<b.id?1:-1):(a.date<b.date?1:-1)).map(t=>`<button class="item" data-txedit="${esc(t.id)}"><span>${esc(t.date)}, ${TL[t.type]}<br><span class="mu">${esc(t.sym||"")}</span></span><span style="text-align:right">${t.type==="buy"||t.type==="sell"?`${fq(t.qty)} × ${money(t.price,cur)}`:money(t.amount,cur)}</span></button>`).join("");
  const e=S.tx.find(x=>x.id===txEdit)||{type:"buy",date:today(),sym:"",qty:"",price:"",fee:"",amount:""};
  const cash=e.type==="div"||e.type==="fee",v=x=>x===""||x==null||x===0?"":String(x).replace(".",",");
  const form=`<div class="card"><b>${txEdit?"Edytuj ruch":"Dodaj ruch"}</b><p class="mu">Kwoty w walucie portfela (${esc(cur)}). Data może być wsteczna.</p>
   <div class="g2"><div><label>Rodzaj</label><select id="t-type">${Object.keys(TL).map(k=>`<option value="${k}"${k===e.type?" selected":""}>${TL[k]}</option>`).join("")}</select></div>
   <div><label>Data</label><input id="t-date" type="date" value="${esc(e.date)}"></div></div>
   <label>Symbol (jak w arkuszu, np. WSE:XTB)</label><input id="t-sym" list="syms" value="${esc(e.sym||"")}"><datalist id="syms">${Object.keys(quotes).map(k=>`<option value="${esc(k)}">`).join("")}</datalist>
   <div id="t-trade" style="display:${cash?"none":""}"><div class="g2"><div><label>Ilość</label><input id="t-qty" inputmode="decimal" value="${v(e.qty)}"></div><div><label>Cena za sztukę</label><input id="t-price" inputmode="decimal" value="${v(e.price)}"></div></div>
   <label>Prowizja (opcjonalnie)</label><input id="t-fee" inputmode="decimal" value="${v(e.fee)}"></div>
   <div id="t-cash" style="display:${cash?"":"none"}"><label>Kwota (dywidenda netto albo opłata)</label><input id="t-amount" inputmode="decimal" value="${v(e.amount)}"></div>
   <div class="g2"><button data-txsave>Zapisz ruch</button>${txEdit?`<button class="ghost" data-txcancel>Anuluj</button>`:"<span></span>"}</div>
   ${txEdit?`<p><button class="danger" data-txdel>Usuń ten ruch</button></p>`:""}</div>`;
  return sel+head+`<div class="card"><b>Pozycje</b>${pos}</div>`+form+(hist?`<div class="card"><b>Historia ruchów</b>${hist}</div>`:"")+newpf+`<p><button class="danger" data-delpf>Usuń ten portfel</button></p>`}

document.addEventListener("change",e=>{
  if(e.target.matches("[data-pfsel]")){pid=e.target.value;txEdit=null;render()}
  if(e.target.id==="t-type"){const c=e.target.value==="div"||e.target.value==="fee";$("#t-trade").style.display=c?"none":"";$("#t-cash").style.display=c?"":"none"}});

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-pfgo],[data-addpf],[data-delpf],[data-txsave],[data-txedit],[data-txdel],[data-txcancel]");if(!t)return;const d=t.dataset;
  if(d.pfgo){pid=d.pfgo;txEdit=null;render()}
  else if("addpf" in d){const name=$("#p-name").value.trim();if(!name){alert("Wpisz nazwę portfela.");return}
    const id=String(Date.now());S.pf=[...S.pf,{id,name,owner:$("#p-owner").value,cur:$("#p-cur").value}];pid=id;save()}
  else if("delpf" in d){if(S.tx.some(x=>x.pid===pid)){alert("Ten portfel ma ruchy. Najpierw usuń je z historii.");return}
    if(confirm("Usunąć ten pusty portfel?")){S.pf=S.pf.filter(x=>x.id!==pid);pid="all";save()}}
  else if(d.txedit){txEdit=d.txedit;render();scrollTo(0,0)}
  else if("txcancel" in d){txEdit=null;render()}
  else if("txdel" in d){if(confirm("Usunąć ten ruch?")){S.tx=S.tx.filter(x=>x.id!==txEdit);txEdit=null;save()}}
  else if("txsave" in d){
    const type=$("#t-type").value,date=$("#t-date").value,sym=$("#t-sym").value.trim().toUpperCase();
    const qty=num($("#t-qty").value),price=num($("#t-price").value),fee=num($("#t-fee").value)||0,amount=num($("#t-amount").value);
    const trade=type==="buy"||type==="sell";
    if(!date||((trade||type==="div")&&!sym)||(trade&&!(qty>0&&price>=0))||(!trade&&!(amount>0))){alert("Uzupełnij datę, symbol oraz ilość i cenę (zakup, sprzedaż) albo kwotę (dywidenda, opłata).");return}
    const rec={id:txEdit||String(Date.now()),pid,type,date,sym,qty:trade?qty:0,price:trade?price:0,fee:trade?fee:0,amount:trade?0:amount};
    S.tx=txEdit?S.tx.map(x=>x.id===txEdit?rec:x):[...S.tx,rec];txEdit=null;save()}});

function viewSoon(n){return `<div class="card"><b>${n}</b><p class="mu">Ten dział dodamy w następnym kroku.</p></div>`}

function render(){const app=$("#app");
  if(!booted){app.innerHTML=`<p class="mu" style="padding:24px">Ładowanie…</p>`;return}
  if(!user){app.innerHTML=`<form class="login" id="lf"><h1>Portfel</h1><p class="mu">Zaloguj się wspólnym kontem aplikacji.</p>
    <label>E-mail</label><input id="l-mail" type="email" value="${EMAIL}" autocomplete="username">
    <label>Hasło</label><input id="l-pass" type="password" autocomplete="current-password">
    ${loginErr?`<p class="bad">${esc(loginErr)}</p>`:""}<button type="submit" style="width:100%">Zaloguj</button></form>`;return}
  const body=tab==="all"?viewAll():tab==="sav"?viewSav():tab==="stk"?viewStk():viewSoon({bnd:"Obligacje",ppk:"PPK"}[tab]);
  const tabs=[["all","Wszystko"],["sav","Konta"],["stk","Akcje"],["bnd","Obligacje"],["ppk","PPK"]];
  app.innerHTML=`<header><h1>Portfel</h1><button class="ghost" data-out>Wyloguj</button></header>
   <div class="st">${esc(info)}${err?` <span class="bad">${esc(err)}</span>`:""}</div><main>${body}</main>
   <nav>${tabs.map(([k,n])=>`<button data-tab="${k}" class="${k===tab?"on":""}">${n}</button>`).join("")}</nav>`}

document.addEventListener("submit",async e=>{
  if(e.target.id!=="lf")return;e.preventDefault();loginErr="";
  try{await signInWithEmailAndPassword(auth,$("#l-mail").value.trim(),$("#l-pass").value)}
  catch(x){loginErr=["auth/invalid-credential","auth/wrong-password","auth/user-not-found"].includes(x.code)?"Błędny e-mail lub hasło.":"Nie udało się zalogować ("+x.code+").";render()}});

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-edit],[data-save],[data-cancel],[data-del],[data-out]");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;editId=null;render()}
  else if(t.dataset.edit){editId=t.dataset.edit;render();scrollTo(0,document.body.scrollHeight)}
  else if("cancel" in t.dataset){editId=null;render()}
  else if("out" in t.dataset){signOut(auth)}
  else if("del" in t.dataset){if(confirm("Usunąć to konto z listy?")){S.accounts=S.accounts.filter(x=>x.id!==editId);editId=null;save()}}
  else if("save" in t.dataset){
    const name=$("#f-name").value.trim(),cur=$("#f-cur").value.trim().toUpperCase(),amount=num($("#f-amount").value);
    if(!name||cur.length!==3||isNaN(amount)){alert("Uzupełnij nazwę, trzyliterową walutę (np. PLN) i saldo.");return}
    const rec={id:editId||String(Date.now()),name,owner:$("#f-owner").value,cur,amount};
    S.accounts=editId?S.accounts.map(x=>x.id===editId?rec:x):[...S.accounts,rec];editId=null;save()}});

onAuthStateChanged(auth,u=>{user=u;booted=true;
  if(unsub){unsub();unsub=null}
  if(u){
    unsub=onSnapshot(doc(db,"data","state"),s=>{S=s.exists()?s.data():{accounts:[]};S.accounts=S.accounts||[];S.pf=S.pf||[];S.tx=S.tx||[];err="";render()},
      e=>{err="Brak dostępu do bazy: "+e.code;render()});
    loadRates()}
  render()});
render();
</script>
</body>
</html>
