<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b3a67">
<title>Portfel</title>
<style>
:root{--bg:#eceff3;--card:#fff;--tx:#18202c;--mu:#5d6878;--ac:#2b3a67;--ac2:#e8ebf5;--bd:#d9dee6;--bad:#b42318;--c1:#2b3a67;--c2:#1f8a7a;--c3:#c9822b;--c4:#8e5db5}
@media(prefers-color-scheme:dark){:root{--bg:#10141b;--card:#1a212b;--tx:#e7ebf1;--mu:#9aa5b5;--ac:#9fb1f0;--ac2:#232c3d;--bd:#2a3340;--bad:#f97066;--c1:#9fb1f0;--c2:#4fc3b0;--c3:#f0b25e;--c4:#c39be6}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 calc(68px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 6px;max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0}
.st{font-size:12px;color:var(--mu);padding:0 16px 8px;max-width:720px;margin:0 auto}
main{max-width:720px;margin:0 auto;padding:8px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.mu{color:var(--mu);font-size:14px}.bad{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.row b{font-variant-numeric:tabular-nums;text-align:right}
button,input,select{font:inherit;color:inherit}
button{background:var(--ac);color:var(--card);border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bd)}
input,select{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{width:100%;text-align:left;background:transparent;color:var(--tx);border-radius:0;padding:10px 0;border-top:1px solid var(--bd);display:flex;justify-content:space-between;gap:10px}
.item:first-child{border-top:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:transparent;color:var(--mu);border-radius:0;padding:14px 2px;font-size:13px}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 2px 0 var(--ac)}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
 .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBSJNAmWuu4SGu1D25rkJrrn6L0CzOmKds",
  authDomain:"portfel-7c77f.firebaseapp.com",
  projectId:"portfel-7c77f",
  storageBucket:"portfel-7c77f.firebasestorage.app",
  messagingSenderId:"954590394780",
  appId:"1:954590394780:web:0b635ea8a6bf48409bf059"
};
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRmNNUaIptQmyWUjvLpJf6oeRlft0DVEbXqoXA0CzfowQizt9uNzR4WFDZT1qW0YCuG9-6RLune9e1C/pub?gid=0&single=true&output=csv";
const EMAIL="portfel.app@portfel.pl";
const OWNERS=["Jakub","Beata","Wspólne"];

const auth=getAuth(initializeApp(firebaseConfig));
const db=getFirestore(auth.app);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=s=>{const n=parseFloat(String(s).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:NaN};
const money=(v,c)=>{try{return new Intl.NumberFormat("pl-PL",{style:"currency",currency:c}).format(v)}catch(e){return v.toFixed(2)+" "+c}};

let user=null,S={accounts:[],pf:[],tx:[],bonds:[],infl:[],ppk:{price:0,pdate:"",e:[]}},tab="all",editId=null,err="",loginErr="",rates={PLN:1},quotes={},info="",unsub=null,booted=false;

function parseCsv(t){const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==","){r.push(f);f=""}
    else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);rows.push(r);r=[];f=""}
    else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}return rows}

function applyRows(rows){rates={PLN:1};quotes={};
  for(const [s,k,w] of rows){if(!s)continue;
    const m=s.match(/^CURRENCY:([A-Z]{3})PLN$/);
    if(m){const n=num(k);if(n>0)rates[m[1]]=n}
    else quotes[s]={price:num(k),fx:num(w)}}}

async function loadRates(){
  try{const res=await fetch(CSV_URL,{cache:"no-store"});if(!res.ok)throw new Error("http");
    const rows=parseCsv(await res.text()).slice(1);applyRows(rows);
    localStorage.setItem("rows",JSON.stringify({t:Date.now(),rows}));
    info="Kursy pobrane: "+new Date().toLocaleString("pl-PL")}
  catch(e){try{const c=JSON.parse(localStorage.getItem("rows"));applyRows(c.rows);
      info="Nie udało się pobrać kursów, pokazuję zapisane z "+new Date(c.t).toLocaleString("pl-PL")}
    catch(_){info="Brak kursów: nie udało się pobrać arkusza"}}
  render()}

async function save(){
  try{await setDoc(doc(db,"data","state"),{accounts:S.accounts,pf:S.pf,tx:S.tx,bonds:S.bonds,infl:S.infl,ppk:S.ppk},{merge:true});err=""}
  catch(e){err="Nie zapisano: "+e.code}
  render()}

function totals(){let t=0;const by={},miss=new Set();
  OWNERS.forEach(o=>by[o]=0);
  for(const a of S.accounts){const r=rates[a.cur];
    if(!r){miss.add(a.cur);continue}
    const v=a.amount*r;t+=v;by[a.owner]=(by[a.owner]||0)+v}
  return{t,by,miss:[...miss]}}

function warn(tt){return tt.miss.length?`<p class="bad">Brak kursu do PLN dla: ${tt.miss.map(esc).join(", ")}. Te konta nie są wliczone. Dodaj w arkuszu wiersz CURRENCY:${esc(tt.miss[0])}PLN.</p>`:""}

function donut(parts){const tot=parts.reduce((a,p)=>a+p.v,0);if(!(tot>0))return `<p class="mu">Brak danych do wykresu.</p>`;
  let off=25,cum=0,segs="",lab="";
  for(const p of parts){if(!(p.v>0))continue;const q=p.v/tot*100;
    segs+=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(${p.c})" stroke-width="7" stroke-dasharray="${q} ${100-q}" stroke-dashoffset="${off}"/>`;
    if(q>=6){const a=(cum+q/2)/100*2*Math.PI-Math.PI/2;lab+=`<text x="${21+15.9155*Math.cos(a)}" y="${21+15.9155*Math.sin(a)}" text-anchor="middle" dominant-baseline="central" font-size="3.4" font-weight="700" fill="var(--card)">${Math.round(q)}%</text>`}
    off-=q;cum+=q}
  return `<svg viewBox="0 0 42 42" role="img" aria-label="Podział aktywów" style="width:240px;max-width:75%;display:block;margin:0 auto 10px">${segs}${lab}</svg>`}

function viewAll(){const tt=totals(),sk=stkTotals(),bt=bondTotals(),pv=ppkCalc().value,sv=tt.t,total=sv+sk.pln+bt.value+pv;
  const parts=[{n:"Oszczędności i konta",v:sv,c:"--c1"},{n:"Akcje",v:sk.pln,c:"--c2"},{n:"Obligacje",v:bt.value,c:"--c3"},{n:"PPK",v:pv,c:"--c4"}];
  const pc=v=>total>0?(v/total*100).toFixed(1).replace(".",",")+" %":"–";
  return `<div class="card"><div class="mu">Razem</div><div class="big">${money(total,"PLN")}</div>${warn({miss:[...new Set([...tt.miss,...sk.miss])]})}</div>
  <div class="card">${donut(parts)}${parts.map(x=>`<div class="row"><span><i class="dot" style="background:var(${x.c})"></i>${x.n}</span><b>${money(x.v,"PLN")} <span class="mu">${pc(x.v)}</span></b></div>`).join("")}</div>`}

function viewSav(){const tt=totals();
  const a=S.accounts.find(x=>x.id===editId)||{name:"",owner:OWNERS[0],cur:"PLN",amount:""};
  const list=S.accounts.length?S.accounts.map(x=>{const r=rates[x.cur];
    return `<button class="item" data-edit="${esc(x.id)}"><span>${esc(x.name)}<br><span class="mu">${esc(x.owner)}</span></span><span style="text-align:right"><b>${money(x.amount,x.cur)}</b>${x.cur!=="PLN"&&r?`<br><span class="mu">≈ ${money(x.amount*r,"PLN")}</span>`:""}</span></button>`}).join(""):`<p class="mu">Nie ma jeszcze żadnych kont. Dodaj pierwsze poniżej.</p>`;
  return `<div class="card"><div class="mu">Suma w PLN</div><div class="big">${money(tt.t,"PLN")}</div>${warn(tt)}</div>
  <div class="card">${list}</div>
  <div class="card"><b>${editId?"Edytuj konto":"Dodaj konto"}</b>
   <label>Nazwa (np. Revolut, ING oszczędnościowe)</label><input id="f-name" value="${esc(a.name)}">
   <div class="g2"><div><label>Właściciel</label><select id="f-owner">${OWNERS.map(o=>`<option${o===a.owner?" selected":""}>${o}</option>`).join("")}</select></div>
   <div><label>Waluta</label><select id="f-cur">${[...new Set(["PLN","EUR","USD","GBP","CHF","CZK","SEK","NOK","DKK","HUF","CAD","AUD","JPY",a.cur])].map(c=>`<option${c===a.cur?" selected":""}>${c}</option>`).join("")}</select></div></div>
   <label>Saldo</label><input id="f-amount" inputmode="decimal" value="${a.amount===""?"":String(a.amount).replace(".",",")}">
   <div class="g2"><button data-save>Zapisz konto</button>${editId?`<button class="ghost" data-cancel>Anuluj</button>`:"<span></span>"}</div>
   ${editId?`<p><button class="danger" data-del>Usuń to konto</button></p>`:""}</div>`}

const CURS=["PLN","EUR","USD","GBP","CHF","CZK","SEK","NOK","DKK","HUF","CAD","AUD","JPY"];
let pid="all",txEdit=null;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const pct=v=>isFinite(v)?(v>=0?"+":"")+(v*100).toFixed(2).replace(".",",")+" %":"–";
const sg=(v,c)=>`<span class="${v<0?"bad":""}">${v>0?"+":""}${money(v,c)}</span>`;
const fq=n=>String(Math.round(n*1e6)/1e6).replace(".",",");
const TL={buy:"Zakup",sell:"Sprzedaż",div:"Dywidenda",fee:"Opłata"};

function calc(p){const pos={};let fees=0,divs=0,buys=0,realized=0;
  const txs=S.tx.filter(t=>t.pid===p.id).sort((a,b)=>a.date===b.date?(a.id<b.id?-1:1):(a.date<b.date?-1:1));
  for(const t of txs){
    if(!t.sym){fees+=t.amount||0;continue}
    const P=pos[t.sym]||(pos[t.sym]={sym:t.sym,qty:0,cost:0});
    if(t.type==="buy"){const c=t.qty*t.price+(t.fee||0);P.qty+=t.qty;P.cost+=c;buys+=c}
    else if(t.type==="sell"){const avg=P.qty>0?P.cost/P.qty:0;realized+=t.qty*t.price-(t.fee||0)-t.qty*avg;P.cost-=t.qty*avg;P.qty-=t.qty}
    else if(t.type==="div")divs+=t.amount||0;
    else if(t.type==="fee")fees+=t.amount||0}
  const open=[],miss=[],neg=[];let value=0,unreal=0;
  for(const P of Object.values(pos)){if(Math.abs(P.qty)<1e-9)continue;
    if(P.qty<0)neg.push(P.sym);
    const q=quotes[P.sym],pr=q&&q.price>0?q.price:NaN;P.avg=P.qty?P.cost/P.qty:0;P.price=pr;
    if(isNaN(pr))miss.push(P.sym);else{P.value=P.qty*pr;P.gain=P.value-P.cost;value+=P.value;unreal+=P.gain}
    open.push(P)}
  const gain=unreal+realized+divs-fees;
  const f=rates[p.cur]||open.map(x=>quotes[x.sym]&&quotes[x.sym].fx).find(v=>v>0);
  return{open,miss,neg,value,unreal,realized,divs,fees,gain,buys,ret:buys>0?gain/buys:NaN,f}}

function stkTotals(){let pln=0;const by={},miss=new Set();
  for(const p of S.pf){const c=calc(p);if(!c.f){miss.add(p.cur);continue}
    pln+=c.value*c.f;by[p.owner]=(by[p.owner]||0)+c.value*c.f}
  return{pln,by,miss:[...miss]}}

function stkAll(){let h="",pln=0,gain=0,buys=0;const miss=new Set();
  for(const p of S.pf){const c=calc(p);if(!c.f){miss.add(p.cur);continue}
    pln+=c.value*c.f;gain+=c.gain*c.f;buys+=c.buys*c.f;
    h+=`<button class="item" data-pfgo="${esc(p.id)}"><span>${esc(p.name)}<br><span class="mu">${esc(p.owner)}, ${esc(p.cur)}</span></span><span style="text-align:right"><b>${money(c.value*c.f,"PLN")}</b><br>${sg(c.gain*c.f,"PLN")} (${pct(c.ret)})</span></button>`}
  return `<div class="card"><div class="mu">Wszystkie portfele w PLN</div><div class="big">${money(pln,"PLN")}</div>
   <div class="row"><span>Wynik łącznie</span><b>${sg(gain,"PLN")} (${pct(buys>0?gain/buys:NaN)})</b></div>
   ${miss.size?`<p class="bad">Brak kursu do PLN dla: ${[...miss].map(esc).join(", ")}. Te portfele nie są wliczone.</p>`:""}</div><div class="card">${h}</div>`}

function viewStk(){
  if(!S.pf.length)pid="";else if(pid==="all"&&S.pf.length===1)pid=S.pf[0].id;else if(pid!=="all"&&!S.pf.find(p=>p.id===pid))pid="all";
  const sel=S.pf.length?`<select data-pfsel>${S.pf.length>1?`<option value="all"${pid==="all"?" selected":""}>Wszystkie portfele (w PLN)</option>`:""}${S.pf.map(p=>`<option value="${esc(p.id)}"${p.id===pid?" selected":""}>${esc(p.name)} (${esc(p.cur)})</option>`).join("")}</select>`:"";
  const newpf=`<div class="card"><b>Nowy portfel</b><label>Nazwa</label><input id="p-name" placeholder="np. IKE">
   <div class="g2"><div><label>Właściciel</label><select id="p-owner">${OWNERS.map(o=>`<option>${o}</option>`).join("")}</select></div>
   <div><label>Waluta portfela</label><select id="p-cur">${CURS.map(c=>`<option>${c}</option>`).join("")}</select></div></div>
   <button data-addpf>Dodaj portfel</button></div>`;
  if(!S.pf.length)return `<div class="card"><p class="mu">Nie ma jeszcze portfeli. Dodaj pierwszy, np. IKE w PLN albo portfel w USD.</p></div>`+newpf;
  if(pid==="all")return sel+stkAll()+newpf;
  const p=S.pf.find(x=>x.id===pid),c=calc(p),cur=p.cur;
  const head=`<div class="card"><div class="mu">Wartość portfela</div><div class="big">${money(c.value,cur)}</div>${cur!=="PLN"&&c.f?`<div class="mu">≈ ${money(c.value*c.f,"PLN")}</div>`:""}
   <div class="row"><span>Wynik łącznie</span><b>${sg(c.gain,cur)} (${pct(c.ret)})</b></div>
   <div class="row"><span>Niezrealizowany</span><b>${sg(c.unreal,cur)}</b></div>
   <div class="row"><span>Zrealizowany (sprzedaże)</span><b>${sg(c.realized,cur)}</b></div>
   <div class="row"><span>Dywidendy</span><b>${money(c.divs,cur)}</b></div>
   <div class="row"><span>Opłaty osobne</span><b>${money(c.fees,cur)}</b></div>
   ${c.miss.length?`<p class="bad">Brak kursu w arkuszu dla: ${c.miss.map(esc).join(", ")}. Te pozycje nie są wliczone do wartości ani wyniku.</p>`:""}
   ${c.neg.length?`<p class="bad">Sprzedano więcej niż kupiono: ${c.neg.map(esc).join(", ")}. Sprawdź historię ruchów.</p>`:""}</div>`;
  const pos=c.open.length?c.open.map(x=>`<div class="row"><span>${esc(x.sym)}<br><span class="mu">${fq(x.qty)} × śr. ${money(x.avg,cur)}</span></span><span style="text-align:right">${isNaN(x.price)?`<span class="mu">brak kursu</span>`:`<b>${money(x.value,cur)}</b><br>${sg(x.gain,cur)} (${pct(x.cost>0?x.gain/x.cost:NaN)})`}</span></div>`).join(""):`<p class="mu">Brak otwartych pozycji. Dodaj pierwszy zakup poniżej.</p>`;
  const hist=S.tx.filter(t=>t.pid===p.id).sort((a,b)=>a.date===b.date?(a.id<b.id?1:-1):(a.date<b.date?1:-1)).map(t=>`<button class="item" data-txedit="${esc(t.id)}"><span>${esc(t.date)}, ${TL[t.type]}<br><span class="mu">${esc(t.sym||"")}</span></span><span style="text-align:right">${t.type==="buy"||t.type==="sell"?`${fq(t.qty)} × ${money(t.price,cur)}`:money(t.amount,cur)}</span></button>`).join("");
  const e=S.tx.find(x=>x.id===txEdit)||{type:"buy",date:today(),sym:"",qty:"",price:"",fee:"",amount:""};
  const cash=e.type==="div"||e.type==="fee",v=x=>x===""||x==null||x===0?"":String(x).replace(".",",");
  const form=`<div class="card"><b>${txEdit?"Edytuj ruch":"Dodaj ruch"}</b><p class="mu">Kwoty w walucie portfela (${esc(cur)}). Data może być wsteczna.</p>
   <div class="g2"><div><label>Rodzaj</label><select id="t-type">${Object.keys(TL).map(k=>`<option value="${k}"${k===e.type?" selected":""}>${TL[k]}</option>`).join("")}</select></div>
   <div><label>Data</label><input id="t-date" type="date" value="${esc(e.date)}"></div></div>
   <label>Symbol (jak w arkuszu, np. WSE:XTB)</label><input id="t-sym" list="syms" value="${esc(e.sym||"")}"><datalist id="syms">${Object.keys(quotes).map(k=>`<option value="${esc(k)}">`).join("")}</datalist>
   <div id="t-trade" style="display:${cash?"none":""}"><div class="g2"><div><label>Ilość</label><input id="t-qty" inputmode="decimal" value="${v(e.qty)}"></div><div><label>Cena za sztukę</label><input id="t-price" inputmode="decimal" value="${v(e.price)}"></div></div>
   <label>Prowizja (opcjonalnie)</label><input id="t-fee" inputmode="decimal" value="${v(e.fee)}"></div>
   <div id="t-cash" style="display:${cash?"":"none"}"><label>Kwota (dywidenda netto albo opłata)</label><input id="t-amount" inputmode="decimal" value="${v(e.amount)}"></div>
   <div class="g2"><button data-txsave>Zapisz ruch</button>${txEdit?`<button class="ghost" data-txcancel>Anuluj</button>`:"<span></span>"}</div>
   ${txEdit?`<p><button class="danger" data-txdel>Usuń ten ruch</button></p>`:""}</div>`;
  return sel+head+`<div class="card"><b>Pozycje</b>${pos}</div>`+form+(hist?`<div class="card"><b>Historia ruchów</b>${hist}</div>`:"")+newpf+`<p><button class="danger" data-delpf>Usuń ten portfel</button></p>`}

document.addEventListener("change",e=>{
  if(e.target.matches("[data-pfsel]")){pid=e.target.value;txEdit=null;render()}
  if(e.target.id==="t-type"){const c=e.target.value==="div"||e.target.value==="fee";$("#t-trade").style.display=c?"none":"";$("#t-cash").style.display=c?"":"none"}});

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-pfgo],[data-addpf],[data-delpf],[data-txsave],[data-txedit],[data-txdel],[data-txcancel]");if(!t)return;const d=t.dataset;
  if(d.pfgo){pid=d.pfgo;txEdit=null;render()}
  else if("addpf" in d){const name=$("#p-name").value.trim();if(!name){alert("Wpisz nazwę portfela.");return}
    const id=String(Date.now());S.pf=[...S.pf,{id,name,owner:$("#p-owner").value,cur:$("#p-cur").value}];pid=id;save()}
  else if("delpf" in d){if(S.tx.some(x=>x.pid===pid)){alert("Ten portfel ma ruchy. Najpierw usuń je z historii.");return}
    if(confirm("Usunąć ten pusty portfel?")){S.pf=S.pf.filter(x=>x.id!==pid);pid="all";save()}}
  else if(d.txedit){txEdit=d.txedit;render();scrollTo(0,0)}
  else if("txcancel" in d){txEdit=null;render()}
  else if("txdel" in d){if(confirm("Usunąć ten ruch?")){S.tx=S.tx.filter(x=>x.id!==txEdit);txEdit=null;save()}}
  else if("txsave" in d){
    const type=$("#t-type").value,date=$("#t-date").value,sym=$("#t-sym").value.trim().toUpperCase();
    const qty=num($("#t-qty").value),price=num($("#t-price").value),fee=num($("#t-fee").value)||0,amount=num($("#t-amount").value);
    const trade=type==="buy"||type==="sell";
    if(!date||((trade||type==="div")&&!sym)||(trade&&!(qty>0&&price>=0))||(!trade&&!(amount>0))){alert("Uzupełnij datę, symbol oraz ilość i cenę (zakup, sprzedaż) albo kwotę (dywidenda, opłata).");return}
    const rec={id:txEdit||String(Date.now()),pid,type,date,sym,qty:trade?qty:0,price:trade?price:0,fee:trade?fee:0,amount:trade?0:amount};
    S.tx=txEdit?S.tx.map(x=>x.id===txEdit?rec:x):[...S.tx,rec];txEdit=null;save()}});

const BT={EDO:{y:10,cap:1,infl:1,fee:3},ROD:{y:12,cap:1,infl:1,fee:3},COI:{y:4,cap:0,infl:1,fee:2},ROS:{y:6,cap:0,infl:1,fee:2},TOS:{y:3,cap:1,infl:0,fee:1},DOR:{y:2,cap:0,infl:0,fee:0.7,mon:1},ROR:{y:1,cap:0,infl:0,fee:0.5,mon:1},OTS:{y:0.25,cap:0,infl:0,fee:0}};
const dAddM=(x,m)=>{const d=D(x);d.setMonth(d.getMonth()+m);return d};
const LAG=2,SRC={own:"Moje",emp:"Pracodawca",state:"Państwo"};
let bEdit=null,peEdit=null;
const D=x=>new Date(x+"T00:00:00");
const dAdd=(x,y)=>{const d=D(x);d.setFullYear(d.getFullYear()+y);return d};
const mk=d=>{const m=new Date(d.getFullYear(),d.getMonth()-LAG,1);return m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")};
const dd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fp=r=>String(Math.round(r*100)/100).replace(".",",")+"%";
const vv=x=>x===""||x==null?"":String(x).replace(".",",");
const inflOf=k=>{const x=S.infl.find(i=>i.m===k);return x?x.v:null};

function bondCalc(b){const now=D(today()),P=100*b.qty,M=Math.round(b.years*12),end=dAddM(b.date,M),matured=end<=now,inf=b.infl!==false,ty=BT[b.type]||{};
  let C=P,acc=0,nextPay=null;const rates=[],miss=[];
  if(ty.mon){let n=0;while(n<M&&dAddM(b.date,n+1)<=now)n++;
    if(!matured){acc=P*b.r1/100*((now-dAddM(b.date,n))/864e5)/365;nextPay=dAddM(b.date,n+1)}rates.push(b.r1)}
  else for(let k=0;k*12<M;k++){const st=dAddM(b.date,12*k);if(st>now)break;
    const ne=dAddM(b.date,12*(k+1)),e=ne<end?ne:end,full=ne<=end;
    let r;if(k===0||!inf)r=b.r1;else{const key=mk(st),c=inflOf(key);if(c==null){miss.push(key);r=b.margin}else r=c+b.margin}
    rates.push(r);const base=b.cap?C:P,yr=base*r/100;
    if(e<=now){if(b.cap)C+=full?yr:yr*((e-st)/864e5)/365}
    else{acc=yr*((now-st)/864e5)/365;nextPay=e}}
  const interest=(b.cap?C-P:0)+acc;
  const fee=matured?0:Math.min((b.fee||0)*b.qty,Math.max(interest,0)),net=b.cap?interest-fee-Math.max(interest-fee,0)*0.19:Math.max(interest,0)*0.81;
  return{P,value:(b.cap?C:P)+acc,interest,net,rates,miss,end,matured,nextPay}}

function bondTotals(){let value=0,invested=0,interest=0;const by={};
  for(const b of S.bonds){const c=bondCalc(b);if(c.matured)continue;value+=c.value;invested+=c.P;interest+=c.interest;by[b.owner]=(by[b.owner]||0)+c.value}
  return{value,invested,interest,by}}

function viewBnd(){
  const list=S.bonds.map(b=>({b,c:bondCalc(b)})).sort((x,y)=>x.c.end-y.c.end),bt=bondTotals();
  const miss=[...new Set(list.filter(x=>!x.c.matured).flatMap(x=>x.c.miss))].sort();
  const sum=`<div class="card"><div class="mu">Obligacje, wartość szacunkowa</div><div class="big">${money(bt.value,"PLN")}</div>
   <div class="row"><span>Wpłacono (bez wykupionych)</span><b>${money(bt.invested,"PLN")}</b></div>
   <div class="row"><span>Odsetki naliczone, niewypłacone (brutto)</span><b>${sg(bt.interest,"PLN")}</b></div>
   ${miss.length?`<p class="bad">Brak inflacji za: ${miss.join(", ")}. Wpisz ją niżej. Na razie liczę tylko marżę, więc wartość jest zaniżona.</p>`:""}</div>`;
  const items=list.length?list.map(({b,c})=>{const left=Math.ceil((c.end-D(today()))/864e5);
    return `<button class="item" data-bedit="${esc(b.id)}"><span>${esc(b.name||b.type)} (${b.type}), ${fq(b.qty)} szt.<br><span class="mu">${esc(b.owner)}, kupno ${esc(b.date)}<br>wykup ${dd(c.end)} ${c.matured?"(termin minął, usuń po wypłacie)":"(za "+left+" dni)"}${c.nextPay&&!b.cap&&!c.matured?`<br>najbliższa wypłata odsetek: ${dd(c.nextPay)}`:""}<br>oprocentowanie w kolejnych latach: ${c.rates.map((r,i)=>(i+1)+": "+fp(r)).join(", ")}</span></span><span style="text-align:right"><b>${money(c.value,"PLN")}</b><br>${sg(c.interest,"PLN")}<br><span class="mu">${b.cap?"odsetki":"od ostatniej wypłaty"}<br>${b.cap?"netto przy wykupie dziś":"netto po podatku"} ${money(c.net,"PLN")}</span></span></button>`}).join(""):`<p class="mu">Nie ma jeszcze obligacji. Dodaj pierwszą poniżej.</p>`;
  const e=S.bonds.find(x=>x.id===bEdit)||{type:"EDO",name:"",owner:OWNERS[0],date:today(),qty:"",r1:"",margin:"",years:10,cap:1,infl:1,fee:3};
  const form=`<div class="card"><b>${bEdit?"Edytuj obligacje":"Dodaj obligacje"}</b><p class="mu">Dane z potwierdzenia zakupu. Jedna sztuka to 100 zł. Lata, sposób naliczania i opłatę sprawdź w warunkach swojej serii. Przy obligacjach o zmiennej stopie (DOR, ROR) wpisz aktualne oprocentowanie, liczę je jako stałe.</p>
   <div class="g2"><div><label>Rodzaj</label><select id="b-type">${Object.keys(BT).map(k=>`<option${k===e.type?" selected":""}>${k}</option>`).join("")}</select></div>
   <div><label>Seria (np. COI0428)</label><input id="b-name" value="${esc(e.name)}"></div></div>
   <div class="g2"><div><label>Właściciel</label><select id="b-owner">${OWNERS.map(o=>`<option${o===e.owner?" selected":""}>${o}</option>`).join("")}</select></div>
   <div><label>Data zakupu</label><input id="b-date" type="date" value="${esc(e.date)}"></div></div>
   <div class="g2"><div><label>Liczba sztuk</label><input id="b-qty" inputmode="decimal" value="${vv(e.qty)}"></div>
   <div><label>Oprocentowanie 1. roku (%)</label><input id="b-r1" inputmode="decimal" value="${vv(e.r1)}"></div></div>
   <div class="g2"><div><label>Oprocentowanie od 2. roku</label><select id="b-infl"><option value="1"${e.infl!==false&&e.infl!==0?" selected":""}>inflacja + marża</option><option value="0"${e.infl===false||e.infl===0?" selected":""}>stałe, jak w 1. roku</option></select></div>
   <div><label>Marża (%)</label><input id="b-margin" inputmode="decimal" value="${vv(e.margin)}"></div></div>
   <div class="g2"><div><label>Czas trwania (lata)</label><input id="b-years" inputmode="decimal" value="${vv(e.years)}"></div>
   <div><label>Odsetki</label><select id="b-cap"><option value="1"${e.cap?" selected":""}>kapitalizowane (doliczane)</option><option value="0"${e.cap?"":" selected"}>wypłacane (co rok / miesiąc)</option></select></div></div>
   <label>Opłata za wcześn. wykup (zł/szt.)</label><input id="b-fee" inputmode="decimal" value="${vv(e.fee)}">
   <div class="g2"><button data-bsave>Zapisz</button>${bEdit?`<button class="ghost" data-bcancel>Anuluj</button>`:"<span></span>"}</div>
   ${bEdit?`<p><button class="danger" data-bdel>Usuń obligacje</button></p>`:""}</div>`;
  const cpi=`<div class="card"><b>Inflacja GUS (r/r)</b><p class="mu">Od 2. roku oprocentowanie = inflacja + marża. Dla okresu zaczynającego się w danym miesiącu bierze się inflację ogłoszoną miesiąc wcześniej, czyli za miesiąc sprzed ${LAG} miesięcy (np. okres od czerwca: inflacja za kwiecień).</p>
   <div class="g2"><div><label>Miesiąc inflacji</label><input id="c-m" type="month" value="${miss[0]||""}"></div><div><label>Inflacja (%)</label><input id="c-v" inputmode="decimal"></div></div>
   <button data-cpisave>Zapisz inflację</button>
   ${[...S.infl].sort((a,b)=>a.m<b.m?1:-1).map(i=>`<button class="item" data-cpidel="${esc(i.m)}"><span>${esc(i.m)}</span><b>${fp(i.v)}</b></button>`).join("")}</div>`;
  return sum+`<div class="card">${items}</div>`+form+cpi}

function ppkCalc(){const P=S.ppk,price=P.price||0,src={own:{u:0,c:0},emp:{u:0,c:0},state:{u:0,c:0}};
  for(const e of P.e){const q=src[e.src];if(q){q.u+=e.units;q.c+=e.amount}}
  let units=0,contrib=0;for(const k in src){const q=src[k];q.v=q.u*price;units+=q.u;contrib+=q.c}
  const value=units*price,o=src.own,m=src.emp,st=src.state;
  const ownTax=Math.max(o.v-o.c,0)*0.19,empRet=0.7*m.v,empTax=Math.max(0.7*(m.v-m.c),0)*0.19;
  return{src,units,contrib,value,gain:value-contrib,ret:contrib>0?(value-contrib)/contrib:NaN,ownNet:o.v-ownTax,empNet:empRet-empTax,zus:0.3*m.v,fp:st.v,net:o.v-ownTax+empRet-empTax}}

function viewPpk(){const P=S.ppk,c=ppkCalc();
  const e=P.e.find(x=>x.id===peEdit)||{date:today(),src:"own",amount:"",units:""};
  const top=`<div class="card"><div class="mu">PPK${P.fund?", "+esc(P.fund):""}, wartość rachunku</div><div class="big">${money(c.value,"PLN")}</div>
   <div class="row"><span>Wpłacono razem</span><b>${money(c.contrib,"PLN")}</b></div>
   <div class="row"><span>Wynik</span><b>${sg(c.gain,"PLN")} (${pct(c.ret)})</b></div>
   <div class="row"><span>Jednostki</span><b>${fq(c.units)}</b></div>
   ${P.price>0?"":`<p class="bad">Wpisz kurs jednostki, żeby zobaczyć wartość.</p>`}
   <label>Nazwa funduszu</label><input id="pp-fund" value="${esc(P.fund||"")}" placeholder="nazwa funduszu"><label>Kurs jednostki (zł)${P.pdate?", z dnia "+esc(P.pdate):""}</label><div class="g2"><input id="pp-price" inputmode="decimal" value="${vv(P.price||"")}"><input id="pp-date" type="date" value="${esc(P.pdate||today())}"></div>
   <button data-ppsave>Zapisz kurs</button></div>`;
  const by=`<div class="card"><div class="mu">Podział wg źródła</div>${Object.keys(SRC).map(k=>`<div class="row"><span>${SRC[k]}<br><span class="mu">wpłacono ${money(c.src[k].c,"PLN")}, ${fq(c.src[k].u)} jedn.</span></span><b>${money(c.src[k].v,"PLN")}</b></div>`).join("")}</div>`;
  const calc=`<div class="card"><b>Gdybym wypłacił dziś przed 60. rokiem życia</b>
   <div class="row"><span>Moje wpłaty i zysk, minus 19% od zysku</span><b>${money(c.ownNet,"PLN")}</b></div>
   <div class="row"><span>Pracodawca: 70% środków, minus podatek</span><b>${money(c.empNet,"PLN")}</b></div>
   <div class="row"><span>Państwo</span><b>${money(0,"PLN")}</b></div>
   <div class="row"><span>Do wypłaty (szacunek)</span><b>${money(c.net,"PLN")}</b></div>
   <div class="row"><span class="mu">30% środków pracodawcy trafia do ZUS</span><span class="mu">${money(c.zus,"PLN")}</span></div>
   <div class="row"><span class="mu">Dopłaty państwa wracają do Funduszu Pracy</span><span class="mu">${money(c.fp,"PLN")}</span></div>
   <p class="mu">Szacunek wg zasad, które sprawdziłem w źródłach (100% moich wpłat, 70% pracodawcy, 0% państwa, 19% podatku od zysku). Sposób liczenia podstawy podatku porównaj z kalkulatorem PZU przed jakąkolwiek decyzją.</p></div>`;
  const form=`<div class="card"><b>${peEdit?"Edytuj wpłatę":"Dodaj wpłatę"}</b>
   <div class="g2"><div><label>Data</label><input id="pe-date" type="date" value="${esc(e.date)}"></div>
   <div><label>Źródło</label><select id="pe-src">${Object.keys(SRC).map(k=>`<option value="${k}"${k===e.src?" selected":""}>${SRC[k]}</option>`).join("")}</select></div></div>
   <div class="g2"><div><label>Kwota (zł)</label><input id="pe-amount" inputmode="decimal" value="${vv(e.amount)}"></div>
   <div><label>Liczba jednostek</label><input id="pe-units" inputmode="decimal" value="${vv(e.units)}"></div></div>
   <div class="g2"><button data-pesave>Zapisz wpłatę</button>${peEdit?`<button class="ghost" data-pecancel>Anuluj</button>`:"<span></span>"}</div>
   ${peEdit?`<p><button class="danger" data-pedel>Usuń wpłatę</button></p>`:""}</div>
   `;
  const rows=[...P.e].sort((a,b)=>a.date===b.date?(a.id<b.id?1:-1):(a.date<b.date?1:-1));
  const hist=rows.length?`<div class="card"><b>Wpłaty (ostatnie 30 z ${rows.length})</b>${rows.slice(0,30).map(x=>`<button class="item" data-peedit="${esc(x.id)}"><span>${esc(x.date)}<br><span class="mu">${SRC[x.src]}</span></span><span style="text-align:right"><b>${money(x.amount,"PLN")}</b><br><span class="mu">${fq(x.units)} jedn.</span></span></button>`).join("")}</div>`:"";
  return top+by+calc+form+hist}

document.addEventListener("change",e=>{
  if(e.target.id==="b-type"){const t=BT[e.target.value];$("#b-years").value=vv(t.y);$("#b-cap").value=t.cap;$("#b-infl").value=t.infl;$("#b-fee").value=vv(t.fee)}});

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-bak],[data-bedit],[data-bsave],[data-bcancel],[data-bdel],[data-cpisave],[data-cpidel],[data-ppsave],[data-pesave],[data-peedit],[data-pecancel],[data-pedel]");if(!t)return;const d=t.dataset;
  if("bak" in d){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="portfel-kopia-"+today()+".json";a.click()}
  else if(d.bedit){bEdit=d.bedit;render();scrollTo(0,document.body.scrollHeight)}
  else if("bcancel" in d){bEdit=null;render()}
  else if("bdel" in d){if(confirm("Usunąć te obligacje?")){S.bonds=S.bonds.filter(x=>x.id!==bEdit);bEdit=null;save()}}
  else if("bsave" in d){const date=$("#b-date").value,qty=num($("#b-qty").value),r1=num($("#b-r1").value),margin=num($("#b-margin").value)||0,years=num($("#b-years").value),fee=num($("#b-fee").value)||0;
    if(!date||!(qty>0)||!(r1>=0)||!(years>0)){alert("Uzupełnij datę, liczbę sztuk, oprocentowanie 1. roku i czas trwania.");return}
    const rec={id:bEdit||String(Date.now()),type:$("#b-type").value,name:$("#b-name").value.trim(),owner:$("#b-owner").value,date,qty,r1,margin,years,cap:$("#b-cap").value==="1",infl:$("#b-infl").value==="1",fee};
    S.bonds=bEdit?S.bonds.map(x=>x.id===bEdit?rec:x):[...S.bonds,rec];bEdit=null;save()}
  else if("cpisave" in d){const m=$("#c-m").value,v=num($("#c-v").value);if(!m||isNaN(v)){alert("Wybierz miesiąc i wpisz inflację.");return}
    S.infl=[...S.infl.filter(i=>i.m!==m),{m,v}];save()}
  else if(d.cpidel){if(confirm("Usunąć wpis inflacji "+d.cpidel+"?")){S.infl=S.infl.filter(i=>i.m!==d.cpidel);save()}}
  else if("ppsave" in d){const price=num($("#pp-price").value),fund=$("#pp-fund").value.trim();
    if(!(price>0)&&!fund){alert("Wpisz kurs jednostki lub nazwę funduszu.");return}
    S.ppk={...S.ppk,fund,price:price>0?price:S.ppk.price,pdate:price>0?$("#pp-date").value:S.ppk.pdate};save()}
  else if(d.peedit){peEdit=d.peedit;render();scrollTo(0,document.body.scrollHeight)}
  else if("pecancel" in d){peEdit=null;render()}
  else if("pedel" in d){if(confirm("Usunąć tę wpłatę?")){S.ppk={...S.ppk,e:S.ppk.e.filter(x=>x.id!==peEdit)};peEdit=null;save()}}
  else if("pesave" in d){const date=$("#pe-date").value,amount=num($("#pe-amount").value),units=num($("#pe-units").value);
    if(!date||!(amount>0)||!(units>0)){alert("Uzupełnij datę, kwotę i liczbę jednostek.");return}
    const rec={id:peEdit||String(Date.now()),date,src:$("#pe-src").value,amount,units};
    S.ppk={...S.ppk,e:peEdit?S.ppk.e.map(x=>x.id===peEdit?rec:x):[...S.ppk.e,rec]};peEdit=null;save()}});

function viewSoon(n){return `<div class="card"><b>${n}</b><p class="mu">Ten dział dodamy w następnym kroku.</p></div>`}

function render(){const app=$("#app");
  if(!booted){app.innerHTML=`<p class="mu" style="padding:24px">Ładowanie…</p>`;return}
  if(!user){app.innerHTML=`<form class="login" id="lf"><h1>Portfel</h1><p class="mu">Zaloguj się wspólnym kontem aplikacji.</p>
    <label>E-mail</label><input id="l-mail" type="email" value="${EMAIL}" autocomplete="username">
    <label>Hasło</label><input id="l-pass" type="password" autocomplete="current-password">
    ${loginErr?`<p class="bad">${esc(loginErr)}</p>`:""}<button type="submit" style="width:100%">Zaloguj</button></form>`;return}
  const body=tab==="all"?viewAll():tab==="sav"?viewSav():tab==="stk"?viewStk():tab==="bnd"?viewBnd():viewPpk();
  const tabs=[["all","Wszystko"],["sav","Konta"],["stk","Akcje"],["bnd","Obligacje"],["ppk","PPK"]];
  app.innerHTML=`<header><h1>Portfel</h1><span><button class="ghost" data-bak>Kopia danych</button> <button class="ghost" data-out>Wyloguj</button></span></header>
   <div class="st">${esc(info)}${err?` <span class="bad">${esc(err)}</span>`:""}</div><main>${body}</main>
   <nav>${tabs.map(([k,n])=>`<button data-tab="${k}" class="${k===tab?"on":""}">${n}</button>`).join("")}</nav>`}

document.addEventListener("submit",async e=>{
  if(e.target.id!=="lf")return;e.preventDefault();loginErr="";
  try{await signInWithEmailAndPassword(auth,$("#l-mail").value.trim(),$("#l-pass").value)}
  catch(x){loginErr=["auth/invalid-credential","auth/wrong-password","auth/user-not-found"].includes(x.code)?"Błędny e-mail lub hasło.":"Nie udało się zalogować ("+x.code+").";render()}});

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-edit],[data-save],[data-cancel],[data-del],[data-out]");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;editId=null;render()}
  else if(t.dataset.edit){editId=t.dataset.edit;render();scrollTo(0,document.body.scrollHeight)}
  else if("cancel" in t.dataset){editId=null;render()}
  else if("out" in t.dataset){signOut(auth)}
  else if("del" in t.dataset){if(confirm("Usunąć to konto z listy?")){S.accounts=S.accounts.filter(x=>x.id!==editId);editId=null;save()}}
  else if("save" in t.dataset){
    const name=$("#f-name").value.trim(),cur=$("#f-cur").value.trim().toUpperCase(),amount=num($("#f-amount").value);
    if(!name||cur.length!==3||isNaN(amount)){alert("Uzupełnij nazwę, trzyliterową walutę (np. PLN) i saldo.");return}
    const rec={id:editId||String(Date.now()),name,owner:$("#f-owner").value,cur,amount};
    S.accounts=editId?S.accounts.map(x=>x.id===editId?rec:x):[...S.accounts,rec];editId=null;save()}});

onAuthStateChanged(auth,u=>{user=u;booted=true;
  if(unsub){unsub();unsub=null}
  if(u){
    unsub=onSnapshot(doc(db,"data","state"),s=>{S=s.exists()?s.data():{accounts:[]};S.accounts=S.accounts||[];S.pf=S.pf||[];S.tx=S.tx||[];S.bonds=S.bonds||[];S.infl=S.infl||[];S.ppk=Object.assign({price:0,pdate:"",fund:"",e:[]},S.ppk||{});const ow=o=>o==="Kuba"?"Jakub":o==="Żona"?"Beata":o;[S.accounts,S.pf,S.bonds].forEach(a=>a.forEach(x=>x.owner=ow(x.owner)));err="";render()},
      e=>{err="Brak dostępu do bazy: "+e.code;render()});
    loadRates()}
  render()});
render();
</script>
