<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b3a67">
<title>Portfel</title>
<style>
:root{--bg:#eceff3;--card:#fff;--tx:#18202c;--mu:#5d6878;--ac:#2b3a67;--ac2:#e8ebf5;--bd:#d9dee6;--bad:#b42318;--c1:#2b3a67;--c2:#1f8a7a;--c3:#c9822b;--c4:#8e5db5;--good:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#10141b;--card:#1a212b;--tx:#e7ebf1;--mu:#9aa5b5;--ac:#9fb1f0;--ac2:#232c3d;--bd:#2a3340;--bad:#f97066;--c1:#9fb1f0;--c2:#4fc3b0;--c3:#f0b25e;--c4:#c39be6;--good:#4ade80}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 calc(68px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 6px;max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0}
.st{font-size:12px;color:var(--mu);padding:0 16px 8px;max-width:720px;margin:0 auto}
main{max-width:720px;margin:0 auto;padding:8px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.mu{color:var(--mu);font-size:14px}.bad{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.row b{font-variant-numeric:tabular-nums;text-align:right}
button,input,select{font:inherit;color:inherit}
button{background:var(--ac);color:var(--card);border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bd)}
input,select{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{width:100%;text-align:left;background:transparent;color:var(--tx);border-radius:0;padding:10px 0;border-top:1px solid var(--bd);display:flex;justify-content:space-between;gap:10px}
.item:first-child{border-top:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:transparent;color:var(--mu);border-radius:0;padding:14px 2px;font-size:13px}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 2px 0 var(--ac)}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
 .good{color:var(--good)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;overflow:auto;padding:12px}
.sh{max-width:560px;margin:2vh auto;background:var(--bg);border-radius:12px;padding:8px 10px 2px}
.sub{padding:0 0 6px 10px;border-left:2px solid var(--bd);margin-left:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBSJNAmWuu4SGu1D25rkJrrn6L0CzOmKds",
  authDomain:"portfel-7c77f.firebaseapp.com",
  projectId:"portfel-7c77f",
  storageBucket:"portfel-7c77f.firebasestorage.app",
  messagingSenderId:"954590394780",
  appId:"1:954590394780:web:0b635ea8a6bf48409bf059"
};
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRmNNUaIptQmyWUjvLpJf6oeRlft0DVEbXqoXA0CzfowQizt9uNzR4WFDZT1qW0YCuG9-6RLune9e1C/pub?gid=0&single=true&output=csv";
const EMAIL="portfel.app@portfel.pl";
const OWNERS=["Jakub","Beata","Wspólne"];

const auth=getAuth(initializeApp(firebaseConfig));
const db=getFirestore(auth.app);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=s=>{const n=parseFloat(String(s).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:NaN};
const money=(v,c)=>{try{return new Intl.NumberFormat("pl-PL",{style:"currency",currency:c}).format(v)}catch(e){return v.toFixed(2)+" "+c}};

let user=null,S={accounts:[],pf:[],tx:[],bonds:[],infl:[],ppk:{price:0,pdate:"",e:[]},dep:[]},tab="all",editId=null,err="",loginErr="",rates={PLN:1},quotes={},info="",unsub=null,booted=false;

function parseCsv(t){const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==","){r.push(f);f=""}
    else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);rows.push(r);r=[];f=""}
    else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}return rows}

function applyRows(rows){rates={PLN:1};quotes={};
  for(const r of rows){const s=r[0];if(!s)continue;const four=r.length>=4,name=four?r[1]:"",k=four?r[2]:r[1],w=four?r[3]:r[2];
    const m=s.match(/^CURRENCY:([A-Z]{3})PLN$/);
    if(m){const n=num(k);if(n>0)rates[m[1]]=n}
    else quotes[s]={sym:s,raw:k,name:name||s,price:num(k),fx:num(w)}}}

async function loadRates(){
  try{const res=await fetch(CSV_URL,{cache:"no-store"});if(!res.ok)throw new Error("http");
    const rows=parseCsv(await res.text()).slice(1);applyRows(rows);
    localStorage.setItem("rows",JSON.stringify({t:Date.now(),rows}));
    info="Kursy pobrane: "+new Date().toLocaleString("pl-PL")}
  catch(e){try{const c=JSON.parse(localStorage.getItem("rows"));applyRows(c.rows);
      info="Nie udało się pobrać kursów, pokazuję zapisane z "+new Date(c.t).toLocaleString("pl-PL")}
    catch(_){info="Brak kursów: nie udało się pobrać arkusza"}}
  render()}

async function save(){modal=null;
  try{await setDoc(doc(db,"data","state"),{accounts:S.accounts,pf:S.pf,tx:S.tx,bonds:S.bonds,infl:S.infl,ppk:S.ppk,dep:S.dep},{merge:true});err=""}
  catch(e){err="Nie zapisano: "+e.code}
  render()}

function totals(){let t=0;const by={},miss=new Set();
  OWNERS.forEach(o=>by[o]=0);
  for(const a of S.accounts){const r=rates[a.cur];
    if(!r){miss.add(a.cur);continue}
    const v=a.amount*r;t+=v;by[a.owner]=(by[a.owner]||0)+v}
  return{t,by,miss:[...miss]}}

function warn(tt){return tt.miss.length?`<p class="bad">Brak kursu do PLN dla: ${tt.miss.map(esc).join(", ")}. Te konta nie są wliczone. Dodaj w arkuszu wiersz CURRENCY:${esc(tt.miss[0])}PLN.</p>`:""}

function donut(parts){const tot=parts.reduce((a,p)=>a+p.v,0);if(!(tot>0))return `<p class="mu">Brak danych do wykresu.</p>`;
  let off=25,cum=0,segs="",lab="";
  for(const p of parts){if(!(p.v>0))continue;const q=p.v/tot*100;
    segs+=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(${p.c})" stroke-width="7" stroke-dasharray="${q} ${100-q}" stroke-dashoffset="${off}"/>`;
    if(q>=6){const a=(cum+q/2)/100*2*Math.PI-Math.PI/2;lab+=`<text x="${21+15.9155*Math.cos(a)}" y="${21+15.9155*Math.sin(a)}" text-anchor="middle" dominant-baseline="central" font-size="3.4" font-weight="700" fill="var(--card)">${Math.round(q)}%</text>`}
    off-=q;cum+=q}
  return `<svg viewBox="0 0 42 42" role="img" aria-label="Podział aktywów" style="width:240px;max-width:75%;display:block;margin:0 auto 10px">${segs}${lab}</svg>`}

function viewAll(){const tt=totals(),sk=stkTotals(),bt=bondTotals(),pk=ppkCalc(),pv=pk.value,sv=tt.t,total=sv+sk.pln+bt.value+pv;
  const parts=[{n:"Oszczędności i konta",v:sv,c:"--c1"},{n:"Akcje",v:sk.pln,c:"--c2"},{n:"Obligacje",v:bt.value,c:"--c3"},{n:"PPK",v:pv,c:"--c4"}];
  const pc=v=>total>0?(v/total*100).toFixed(1).replace(".",",")+" %":"–";
  const own=pk.src.own.c,gAll=sk.gain+(bt.value-bt.invOwn)+(pv-own),bAll=sk.base+bt.invOwn+own,fAll=[sk.first,bt.firstOwn,pk.first].filter(Boolean).sort()[0]||"";
  return `<div class="card"><div class="mu">Razem</div><div class="big">${money(total,"PLN")}</div>${warn({miss:[...new Set([...tt.miss,...sk.miss])]})}</div>
  <div class="card"><div class="mu">Inwestycje razem, od moich wpłat</div><div class="row"><span>Wynik</span><b>${sg(gAll,"PLN")}</b></div>${fAll&&bAll>0?retRows(gAll/bAll,fAll):""}
   <p class="mu">Podstawą są Twoje wpłaty: do portfeli akcji, obligacje kupione z własnych środków i własne wpłaty do PPK. Reinwestowane odsetki oraz wpłaty pracodawcy i państwa liczą się jako zysk.</p></div>
  <div class="card">${donut(parts)}${parts.map(x=>`<div class="row"><span><i class="dot" style="background:var(${x.c})"></i>${x.n}</span><b>${money(x.v,"PLN")} <span class="mu">${pc(x.v)}</span></b></div>`).join("")}</div>
  <div class="g2"><button class="ghost" data-bak>Kopia danych</button><button class="ghost" data-out>Wyloguj</button></div>`}

function viewSav(){const tt=totals();
  const a=S.accounts.find(x=>x.id===editId)||{name:"",owner:OWNERS[0],cur:"PLN",amount:""};
  const list=S.accounts.length?S.accounts.map(x=>{const r=rates[x.cur];
    return `<button class="item" data-edit="${esc(x.id)}"><span>${esc(x.name)}<br><span class="mu">${esc(x.owner)}</span></span><span style="text-align:right"><b>${money(x.amount,x.cur)}</b>${x.cur!=="PLN"&&r?`<br><span class="mu">≈ ${money(x.amount*r,"PLN")}</span>`:""}</span></button>`}).join(""):`<p class="mu">Nie ma jeszcze żadnych kont.</p>`;
  const form=`<div class="card"><b>${editId?"Edytuj konto":"Dodaj konto"}</b>
   <label>Nazwa (np. Revolut, ING oszczędnościowe)</label><input id="f-name" value="${esc(a.name)}">
   <div class="g2"><div><label>Właściciel</label><select id="f-owner">${OWNERS.map(o=>`<option${o===a.owner?" selected":""}>${o}</option>`).join("")}</select></div>
   <div><label>Waluta</label><select id="f-cur">${[...new Set([...CURS,a.cur])].map(c=>`<option${c===a.cur?" selected":""}>${c}</option>`).join("")}</select></div></div>
   <label>Saldo</label><input id="f-amount" inputmode="decimal" value="${a.amount===""?"":String(a.amount).replace(".",",")}">
   <button data-save style="width:100%">Zapisz konto</button>
   ${editId?`<p><button class="danger" data-del>Usuń to konto</button></p>`:""}</div>`;
  return `<div class="card"><div class="mu">Suma w PLN</div><div class="big">${money(tt.t,"PLN")}</div>${warn(tt)}</div><div class="card">${list}</div><button data-open="acc" style="width:100%">+ Dodaj konto</button>${modal==="acc"?sheet(form):""}`}

const CURS=["PLN","EUR","USD","GBP","CHF","CZK","SEK","NOK","DKK","HUF","CAD","AUD","JPY"];
let pid="all",txEdit=null;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const pct=v=>isFinite(v)?`<span class="${v<0?"bad":v>0?"good":""}">${v>=0?"+":""}${(v*100).toFixed(2).replace(".",",")} %</span>`:"–";
const sg=(v,c)=>`<span class="${v<0?"bad":v>0?"good":""}">${v>0?"+":""}${money(v,c)}</span>`;
const fq=n=>String(Math.round(n*1e6)/1e6).replace(".",",");
const TL={buy:"Zakup",sell:"Sprzedaż",div:"Dywidenda",fee:"Opłata"};

let modal=null,ui={},txSym="",cpiKey="",depEdit=null;
const sheet=h=>`<div class="ov"><div class="sh"><div style="text-align:right"><button class="ghost" data-close>Zamknij</button></div>${h}</div></div>`;
const nm=x=>quotes[x]?quotes[x].name:x;
const rt=c=>c==="PLN"?1:rates[c];
function ccyOf(sym){const q=quotes[sym];if(!q||!(q.fx>0))return null;if(Math.abs(q.fx-1)<1e-9)return "PLN";for(const c in rates)if(c!=="PLN"&&Math.abs(rates[c]/q.fx-1)<0.003)return c;return null}
const effFx=t=>{const f=t.fx>0?t.fx:1,m=(t.mg||0)/100;return t.type==="sell"?f*(1-m):f*(1+m)};

function calc(p){const pos={};let fees=0,divs=0,buys=0,realized=0,first="",sold=0;
  const txs=S.tx.filter(t=>t.pid===p.id).sort((a,b)=>a.date===b.date?(a.id<b.id?-1:1):(a.date<b.date?-1:1));
  for(const t of txs){
    if(!t.sym){fees+=t.amount||0;continue}
    const P=pos[t.sym]||(pos[t.sym]={sym:t.sym,qty:0,cost:0,costX:0});
    if(t.type==="buy"){const c=(t.tot>0?t.tot:t.qty*t.price*effFx(t))+(t.fee||0);P.qty+=t.qty;P.cost+=c;P.costX+=t.qty*t.price;buys+=c;if(!first||t.date<first)first=t.date;if(!P.first||t.date<P.first)P.first=t.date}
    else if(t.type==="sell"){const avg=P.qty>0?P.cost/P.qty:0,avgX=P.qty>0?P.costX/P.qty:0,pr=(t.tot>0?t.tot:t.qty*t.price*effFx(t))-(t.fee||0);
      realized+=pr-t.qty*avg;sold+=pr;P.cost-=t.qty*avg;P.costX-=t.qty*avgX;P.qty-=t.qty}
    else if(t.type==="div")divs+=t.amount||0;
    else if(t.type==="fee")fees+=t.amount||0}
  const open=[],miss=[],neg=[];let value=0,unreal=0;
  for(const P of Object.values(pos)){if(Math.abs(P.qty)<1e-9)continue;
    if(P.qty<0)neg.push(P.sym);
    const q=quotes[P.sym],pr=q&&q.price>0?q.price:NaN,X=ccyOf(P.sym)||p.cur,k=X===p.cur?1:(rt(X)&&rt(p.cur)?rt(X)/rt(p.cur):NaN);
    P.ccy=X;P.avg=P.qty?P.cost/P.qty:0;P.avgX=P.qty?P.costX/P.qty:0;P.price=pr;
    if(isNaN(pr)||isNaN(k))miss.push(P.sym);else{P.value=P.qty*pr*k;P.gain=P.value-P.cost;value+=P.value;unreal+=P.gain}
    open.push(P)}
  const gain=unreal+realized+divs-fees;
  const f=rates[p.cur]||open.map(x=>quotes[x.sym]&&quotes[x.sym].fx).find(v=>v>0);
  const dep=depInfo(p);let gainD=NaN,gainDPLN=NaN,retD=NaN;
  if(dep.dP>0){const cash=dep.dP-buys+sold+divs-fees,eq=value+Math.max(cash,0);gainD=eq-dep.dP;if(f){gainDPLN=eq*f-dep.dPLN;retD=gainDPLN/dep.dPLN}}
  return{open,miss,neg,value,unreal,realized,divs,fees,gain,buys,first,ret:buys>0?gain/buys:NaN,f,dep,gainD,gainDPLN,retD}}

function depInfo(p){let dP=0,dPLN=0,first="";
  for(const d of S.dep.filter(x=>x.pid===p.id)){const f=d.fx>0?d.fx:1,a=d.amount;let P,PLN;
    if(d.cur===p.cur){P=a;PLN=d.cur==="PLN"?a:a*f}
    else if(d.cur==="PLN"){PLN=a;P=a/f}
    else if(p.cur==="PLN"){P=a*f;PLN=P}
    else continue;
    dP+=P;dPLN+=PLN;if(!first||d.date<first)first=d.date}
  return{dP,dPLN,first}}

function stkTotals(){let pln=0,gain=0,base=0,first="";const by={},miss=new Set();
  for(const p of S.pf){const c=calc(p);if(!c.f){miss.add(p.cur);continue}
    const u=c.dep.dP>0,fd=u?c.dep.first:c.first;
    pln+=c.value*c.f;gain+=u?c.gainDPLN:c.gain*c.f;base+=u?c.dep.dPLN:c.buys*c.f;if(fd&&(!first||fd<first))first=fd;
    by[p.owner]=(by[p.owner]||0)+c.value*c.f}
  return{pln,gain,base,first,by,miss:[...miss]}}

function stkAll(){let h="",pln=0,gain=0,base=0,first="";const miss=new Set();
  for(const p of S.pf){const c=calc(p);if(!c.f){miss.add(p.cur);continue}
    const u=c.dep.dP>0,g=u?c.gainDPLN:c.gain*c.f,b=u?c.dep.dPLN:c.buys*c.f,fd=u?c.dep.first:c.first,r=u?c.retD:c.ret;
    pln+=c.value*c.f;gain+=g;base+=b;if(fd&&(!first||fd<first))first=fd;
    h+=`<button class="item" data-pfgo="${esc(p.id)}"><span>${esc(p.name)}<br><span class="mu">${esc(p.owner)}, ${esc(p.cur)}</span></span><span style="text-align:right"><b>${money(c.value*c.f,"PLN")}</b><br>${sg(g,"PLN")} (${pct(r)})</span></button>`}
  return `<div class="card"><div class="mu">Wszystkie portfele w PLN</div><div class="big">${money(pln,"PLN")}</div>
   <div class="row"><span>Wynik łącznie</span><b>${sg(gain,"PLN")}</b></div>${first?retRows(base>0?gain/base:NaN,first):""}
   ${miss.size?`<p class="bad">Brak kursu do PLN dla: ${[...miss].map(esc).join(", ")}. Te portfele nie są wliczone.</p>`:""}</div><div class="card">${h}</div>`}

function viewStk(){
  if(!S.pf.length)pid="";else if(pid==="all"&&S.pf.length===1)pid=S.pf[0].id;else if(pid!=="all"&&!S.pf.find(p=>p.id===pid))pid="all";
  const one=pid&&pid!=="all";
  const top=`<div class="g2" style="margin-bottom:12px"><button data-open="pf">+ Nowy portfel</button>${one?`<button data-open="dep">+ Dodaj wpłatę</button>`:"<span></span>"}</div>${one?`<button data-open="tx" style="width:100%;margin-bottom:12px">+ Dodaj ruch</button>`:""}`;
  const pfForm=`<div class="card"><b>Nowy portfel</b><label>Nazwa</label><input id="p-name" placeholder="np. IKE">
   <div class="g2"><div><label>Właściciel</label><select id="p-owner">${OWNERS.map(o=>`<option>${o}</option>`).join("")}</select></div>
   <div><label>Waluta portfela</label><select id="p-cur">${CURS.map(c=>`<option>${c}</option>`).join("")}</select></div></div>
   <button data-addpf style="width:100%">Dodaj portfel</button></div>`;
  const mod=modal==="pf"?sheet(pfForm):"";
  const sel=S.pf.length?`<select data-pfsel>${S.pf.length>1?`<option value="all"${pid==="all"?" selected":""}>Wszystkie portfele (w PLN)</option>`:""}${S.pf.map(p=>`<option value="${esc(p.id)}"${p.id===pid?" selected":""}>${esc(p.name)} (${esc(p.cur)})</option>`).join("")}</select>`:"";
  if(!S.pf.length)return top+`<div class="card"><p class="mu">Nie ma jeszcze portfeli. Dodaj pierwszy, np. IKE w PLN albo portfel w USD.</p></div>`+mod;
  if(pid==="all")return top+sel+stkAll()+mod;
  const p=S.pf.find(x=>x.id===pid),c=calc(p),cur=p.cur;
  const desc=(a,b)=>a.date===b.date?(a.id<b.id?1:-1):(a.date<b.date?1:-1);
  const txItem=t=>{const X=ccyOf(t.sym)||cur;return `<button class="item" data-txedit="${esc(t.id)}"><span>${esc(t.date)}, ${TL[t.type]}<br><span class="mu">${esc(t.sym?nm(t.sym):"")}</span></span><span style="text-align:right">${t.type==="buy"||t.type==="sell"?`${fq(t.qty)} × ${money(t.price,X)}${t.fx>0&&Math.abs(t.fx-1)>1e-7?`<br><span class="mu">kurs ${vv(t.fx)}${t.mg?`, marża ${vv(t.mg)}%`:""}</span>`:""}`:money(t.amount,cur)}</span></button>`};
  const useD=c.dep.dP>0,gT=useD?c.gainD:c.gain,rT=useD?c.retD:c.ret,fT=useD?c.dep.first:c.first;
  const head=`<div class="card"><div class="mu">Wartość portfela</div><div class="big">${money(c.value,cur)}</div>${cur!=="PLN"&&c.f?`<div class="mu">≈ ${money(c.value*c.f,"PLN")}</div>`:""}

document.addEventListener("change",e=>{

    if(!date||((trade||type==="div")&&!sym)||(trade&&!(qty>0&&price>=0))||(!trade&&!(amount>0))){alert("Uzupełnij datę, papier oraz ilość i cenę (zakup, sprzedaż) albo kwotę (dywidenda, opłata).");return}

const BT={EDO:{y:10,cap:1,infl:1,fee:3},ROD:{y:12,cap:1,infl:1,fee:3},COI:{y:4,cap:0,infl:1,fee:2},ROS:{y:6,cap:0,infl:1,fee:2},TOS:{y:3,cap:1,infl:0,fee:1},DOR:{y:2,cap:0,infl:0,fee:0.7,mon:1},ROR:{y:1,cap:0,infl:0,fee:0.5,mon:1},OTS:{y:0.25,cap:0,infl:0,fee:0}};
const dAddM=(x,m)=>{const d=D(x);d.setMonth(d.getMonth()+m);return d};
const LAG=2,SRC={own:"Moje",emp:"Pracodawca",state:"Państwo"};
let bEdit=null,peEdit=null;
const D=x=>new Date(x+"T00:00:00");
const dAdd=(x,y)=>{const d=D(x);d.setFullYear(d.getFullYear()+y);return d};
const mk=d=>{const m=new Date(d.getFullYear(),d.getMonth()-LAG,1);return m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")};
const dd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fp=r=>String(Math.round(r*100)/100).replace(".",",")+"%";
const vv=x=>x===""||x==null?"":String(x).replace(".",",");
const inflOf=k=>{const x=S.infl.find(i=>i.m===k);return x?x.v:null};

const ann=(r,from)=>{const n=(D(today())-D(from))/864e5;return n>=365&&1+r>0?Math.pow(1+r,365/n)-1:NaN};
const retRows=(r,from,label,an)=>`<div class="row"><span>${label||"Stopa zwrotu"} <span class="mu">(od ${esc(from)})</span></span><b>${pct(r)}</b></div><div class="row"><span>Średniorocznie</span><b>${pct(an===undefined?ann(r,from):an)}</b></div>`;
function payDates(b){const M=Math.round(b.years*12),ty=BT[b.type]||{},out=[];if(b.cap)return out;
  if(ty.mon){for(let n=1;n<=M;n++)out.push(dAddM(b.date,n))}
  else if(M<12)out.push(dAddM(b.date,M));else for(let k=1;k*12<=M;k++)out.push(dAddM(b.date,12*k));
  return out}
function lastPast(b){const now=D(today());let r=D(b.date);for(const d of payDates(b)){if(d<=now)r=d;else break}return r}
function payDue(b){const paid=b.paid?D(b.paid):lastPast(b);return payDates(b).find(d=>d>paid)||null}

function bondCalc(b){const now=D(today()),P=100*b.qty,M=Math.round(b.years*12),end=dAddM(b.date,M),matured=end<=now,inf=b.infl!==false,ty=BT[b.type]||{};
  let C=P,acc=0,nextPay=null,sr=0;const rates=[],miss=[],el=Math.max((Math.min(now,end)-D(b.date))/864e5,0);
  if(ty.mon){let n=0;while(n<M&&dAddM(b.date,n+1)<=now)n++;
    if(!matured){acc=P*b.r1/100*((now-dAddM(b.date,n))/864e5)/365;nextPay=dAddM(b.date,n+1)}rates.push(b.r1);sr=b.r1*el/365}
  else for(let k=0;k*12<M;k++){const st=dAddM(b.date,12*k);if(st>now)break;
    const ne=dAddM(b.date,12*(k+1)),e=ne<end?ne:end,full=ne<=end;
    let r;if(k===0||!inf)r=b.r1;else{const key=mk(st),c=inflOf(key);if(c==null){miss.push(key);r=b.margin}else r=c+b.margin}
    rates.push(r);const base=b.cap?C:P,yr=base*r/100;
    if(e<=now){if(b.cap)C+=full?yr:yr*((e-st)/864e5)/365;sr+=full?r:r*((e-st)/864e5)/365}
    else{acc=yr*((now-st)/864e5)/365;nextPay=e;sr+=r*((now-st)/864e5)/365}}
  const interest=(b.cap?C-P:0)+acc;
  const fee=matured?0:Math.min((b.fee||0)*b.qty,Math.max(interest,0)),net=b.cap?interest-fee-Math.max(interest-fee,0)*0.19:Math.max(interest,0)*0.81;
  const tot=b.cap?(C+acc-P)/P:sr/100,an=b.cap?ann(tot,b.date):(el>=365?tot/(el/365):NaN);
  return{P,value:(b.cap?C:P)+acc,interest,net,rates,miss,end,matured,nextPay,tot,an}}

function bondTotals(){let value=0,invested=0,interest=0,invOwn=0,firstOwn="";const by={};
  for(const b of S.bonds){const c=bondCalc(b);if(c.matured)continue;value+=c.value;invested+=c.P;interest+=c.interest;by[b.owner]=(by[b.owner]||0)+c.value;
    if(!b.reinv){invOwn+=c.P;if(!firstOwn||b.date<firstOwn)firstOwn=b.date}}
  return{value,invested,interest,invOwn,firstOwn,by}}

   <div class="g2"><div><label>Rodzaj</label><select id="b-type">${Object.keys(BT).map(k=>`<option${k===e.type?" selected":""}>${k}</option>`).join("")}</select></div>

  const cpiForm=`<div class="card"><b>Inflacja GUS (r/r)</b><p class="mu">Wpis dotyczy wszystkich obligacji naraz, więc wystarczy wpisać go raz. Od 2. roku oprocentowanie = inflacja + marża. Dla okresu zaczynającego się w danym miesiącu bierze się inflację za miesiąc sprzed ${LAG} miesięcy (np. okres od czerwca: inflacja za kwiecień).</p>

   <label>Inflacja (%)</label><input id="c-v" inputmode="decimal">
   <button data-cpisave style="width:100%">Zapisz inflację</button>
   ${[...S.infl].sort((a,b)=>a.m<b.m?1:-1).map(i=>`<button class="item" data-cpidel="${esc(i.m)}"><span>${esc(i.m)}</span><b>${fp(i.v)}</b></button>`).join("")}</div>`;
  return `<div class="g2" style="margin-bottom:12px"><button data-open="bond">+ Dodaj obligację</button><button class="ghost" data-open="cpi">Inflacja GUS</button></div>`+sum+`<div class="card">${items}</div>`+(modal==="bond"?sheet(form):"")+(modal==="cpi"?sheet(cpiForm):"")}

const ppkQ=()=>{if(quotes.PPK)return quotes.PPK;const k=Object.keys(quotes).find(x=>/^PPK/i.test(x.trim())||/^PPK/i.test(String(quotes[x].name).trim()));return k?quotes[k]:null};
function ppkCalc(){const P=S.ppk,q=ppkQ(),auto=!!(q&&q.price>0),price=auto&&!P.override?q.price:(P.price||0),src={own:{u:0,c:0},emp:{u:0,c:0},state:{u:0,c:0}};
  let first=P.first||"";
  for(const e of P.e){const s=src[e.src];if(s){s.u+=e.units;s.c+=e.amount}if(!P.first&&(!first||e.date<first))first=e.date}
  let units=0,contrib=0;for(const k in src){const s=src[k];s.v=s.u*price;units+=s.u;contrib+=s.c}
  const value=units*price,o=src.own,m=src.emp;
  const ownTax=Math.max(o.v-o.c,0)*0.19,empRet=0.7*m.v,empTax=Math.max(0.7*(m.v-m.c),0)*0.19;
  const gain=value-contrib;
  return{src,units,contrib,value,price,auto,q,first,gain,ret:contrib>0?gain/contrib:NaN,ownNet:o.v-ownTax,empNet:empRet-empTax,zus:0.3*m.v,fp:src.state.v,net:o.v-ownTax+empRet-empTax}}

function viewPpk(){const P=S.ppk,c=ppkCalc(),fr=c.first||today();
  const sm=r=>`<div class="mu" style="font-size:12px">${pct(r)} całościowo, rocznie ${pct(ann(r,fr))}</div>`;
  const vr=c.contrib>0?(c.value-c.contrib)/c.contrib:NaN,wr=c.src.own.c>0?(c.net-c.src.own.c)/c.src.own.c:NaN;
  const hint=P.override?"Kurs ustawiony ręcznie.":c.auto?"Kurs z arkusza (automatyczny).":c.q?`W arkuszu jest wiersz „${esc(c.q.sym)}”, ale kurs to „${esc(c.q.raw)}”, a nie liczba.`:"Nie widzę w arkuszu wiersza PPK (w kolumnie A musi być PPK). Wpisz kurs ręcznie.";
  const top=`<div class="card"><div class="g2" style="align-items:start"><div><div class="mu">Wartość PPK</div><div class="big" style="font-size:26px">${money(c.value,"PLN")}</div>${sm(vr)}</div>
   <div style="text-align:right"><div class="mu">Wypłata dziś</div><div class="big good" style="font-size:26px">${money(c.net,"PLN")}</div>${sm(wr)}</div></div>
   <button class="ghost" data-tog="ppcalc" style="width:100%;margin-top:8px">Szczegóły wypłaty ${ui.ppcalc?"▲":"▼"}</button>
   ${ui.ppcalc?`<div class="row"><span>Moje wpłaty i zysk, minus 19% od zysku</span><b>${money(c.ownNet,"PLN")}</b></div>
   <div class="row"><span>Pracodawca: 70% środków, minus podatek</span><b>${money(c.empNet,"PLN")}</b></div>
   <div class="row"><span>Państwo</span><b>${money(0,"PLN")}</b></div>
   <div class="row"><span class="mu">30% środków pracodawcy trafia do ZUS</span><span class="mu">${money(c.zus,"PLN")}</span></div>
   <div class="row"><span class="mu">Dopłaty państwa wracają do Funduszu Pracy</span><span class="mu">${money(c.fp,"PLN")}</span></div>
   <p class="mu">Szacunek wg zasad, które sprawdziłem w źródłach (100% moich wpłat, 70% pracodawcy, 0% państwa, 19% podatku od zysku). Sposób liczenia podstawy podatku porównaj z kalkulatorem PZU przed jakąkolwiek decyzją.</p>`:""}
   <div class="row"><span>Wpłacono razem</span><b>${money(c.contrib,"PLN")}</b></div>
   <div class="row"><span>Jednostki</span><b>${fq(c.units)}</b></div>
   <div class="row"><span>Wynik funduszu</span><span style="text-align:right"><b>${sg(c.gain,"PLN")}</b><br><span class="mu">${pct(c.ret)} całościowo, rocznie ${pct(ann(c.ret,fr))}</span></span></div>
   <div style="margin-top:10px"><div class="g2"><div><label>Nazwa funduszu</label><input id="pp-fund" value="${esc(P.fund||"")}" placeholder="nazwa funduszu"></div>
   <div><label>Kurs jednostki (zł)</label><input id="pp-price" inputmode="decimal" value="${vv(c.price||"")}"></div></div>
   <p class="mu" style="margin:0 0 8px">${hint}</p>
   <button data-ppsave>Zapisz</button>${P.override&&c.auto?` <button class="ghost" data-ppauto>Wróć do kursu z arkusza</button>`:""}
   <p><a href="https://www.analizy.pl/fundusze-ppk/PZU59/ppk-inpzu-2055" target="_blank" rel="noopener" style="color:var(--ac)">Sprawdź kurs na analizy.pl</a></p></div></div>`;
  const srcBlock=k=>{const q=c.src[k],ed=ui["ppe:"+k];return `<div class="card"><b>${SRC[k]}</b>
   <div class="row"><span>Suma wpłat</span><b>${money(q.c,"PLN")}</b></div>
   <div class="row"><span>Jednostki</span><b>${fq(q.u)}</b></div>
   <div class="row"><span>Wartość</span><b>${money(q.v,"PLN")}</b></div>
   <div class="g2"><div><label>Kolejna wpłata (zł, minus = odejmij)</label><input id="pa-${k}-a" autocomplete="off"></div><div><label>Ilość jednostek</label><input id="pa-${k}-u" autocomplete="off"></div></div>
   <button data-ppadd="${k}" style="width:100%">Potwierdź</button>
   <button class="ghost" data-tog="ppe:${k}" style="width:100%;margin-top:8px">Edytuj sumy ${ed?"▲":"▼"}</button>
   ${ed?`<div class="g2"><div><label>Suma wpłat (zł)</label><input id="pe-${k}-a" value="${vv(Math.round(q.c*100)/100)}"></div><div><label>Jednostki</label><input id="pe-${k}-u" value="${vv(Math.round(q.u*1e6)/1e6)}"></div></div><button data-ppesave="${k}" style="width:100%">Zapisz sumy</button>`:""}</div>`};
  const first=`<div class="card"><label>Data pierwszej wpłaty</label><div class="g2"><input id="pp-first" type="date" value="${esc(c.first||"")}"><button data-ppfirst>Zapisz datę</button></div></div>`;
  return top+`<button class="ghost" data-tog="ppdep" style="width:100%;margin-bottom:12px">Wpłaty wg źródła ${ui.ppdep?"▲":"▼"}</button>`+(ui.ppdep?first+Object.keys(SRC).map(srcBlock).join(""):"")}

document.addEventListener("change",e=>{
  if(e.target.id==="b-type"){const t=BT[e.target.value];$("#b-years").value=vv(t.y);$("#b-cap").value=t.cap;$("#b-infl").value=t.infl;$("#b-fee").value=vv(t.fee)}});

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-bak],[data-bedit],[data-bsave],[data-bcancel],[data-bdel],[data-cpisave],[data-cpidel],[data-ppsave],[data-pesave],[data-peedit],[data-pecancel],[data-pedel]");if(!t)return;const d=t.dataset;
  if("bak" in d){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="portfel-kopia-"+today()+".json";a.click()}
  else if(d.bedit){bEdit=d.bedit;modal="bond";render()}
  else if("bcancel" in d){bEdit=null;render()}
  else if("bdel" in d){if(confirm("Usunąć te obligacje?")){S.bonds=S.bonds.filter(x=>x.id!==bEdit);bEdit=null;save()}}
  else if("bsave" in d){const date=$("#b-date").value,qty=num($("#b-qty").value),r1=num($("#b-r1").value),margin=num($("#b-margin").value)||0,years=num($("#b-years").value),fee=num($("#b-fee").value)||0;
    if(!date||!(qty>0)||!(r1>=0)||!(years>0)){alert("Uzupełnij datę, liczbę sztuk, oprocentowanie 1. roku i czas trwania.");return}
    const rec={id:bEdit||String(Date.now()),type:$("#b-type").value,name:$("#b-name").value.trim(),owner:$("#b-owner").value,date,qty,r1,margin,years,cap:$("#b-cap").value==="1",infl:$("#b-infl").value==="1",fee,reinv:$("#b-src").value==="1",paid:(S.bonds.find(x=>x.id===bEdit)||{}).paid||""};if(!rec.cap&&!rec.paid)rec.paid=dd(lastPast(rec));
    S.bonds=bEdit?S.bonds.map(x=>x.id===bEdit?rec:x):[...S.bonds,rec];bEdit=null;save()}
  else if("cpisave" in d){const m=$("#c-m").value,v=num($("#c-v").value);if(!m||isNaN(v)){alert("Wybierz miesiąc i wpisz inflację.");return}
    S.infl=[...S.infl.filter(i=>i.m!==m),{m,v}];save()}
  else if(d.cpidel){if(confirm("Usunąć wpis inflacji "+d.cpidel+"?")){S.infl=S.infl.filter(i=>i.m!==d.cpidel);save()}}
  else if("ppsave" in d){const price=num($("#pp-price").value),fund=$("#pp-fund").value.trim(),q=ppkQ(),au=q&&q.price>0?q.price:0;
    if(!(price>0)&&!fund){alert("Wpisz kurs jednostki lub nazwę funduszu.");return}
    S.ppk={...S.ppk,fund,price:price>0?price:S.ppk.price,override:price>0?(!au||Math.abs(price-au)>1e-9):S.ppk.override,pdate:price>0?today():S.ppk.pdate};save()}
  else if(d.peedit){peEdit=d.peedit;modal="ppe";render()}
  else if("pecancel" in d){peEdit=null;render()}
  else if("pedel" in d){if(confirm("Usunąć tę wpłatę?")){S.ppk={...S.ppk,e:S.ppk.e.filter(x=>x.id!==peEdit)};peEdit=null;save()}}
  else if("pesave" in d){const date=$("#pe-date").value,amount=num($("#pe-amount").value),units=num($("#pe-units").value);
    if(!date||!(amount>0)||!(units>0)){alert("Uzupełnij datę, kwotę i liczbę jednostek.");return}
    const rec={id:peEdit||String(Date.now()),date,src:$("#pe-src").value,amount,units};
    S.ppk={...S.ppk,e:peEdit?S.ppk.e.map(x=>x.id===peEdit?rec:x):[...S.ppk.e,rec]};peEdit=null;save()}});

const fxSync=()=>{const sel=$("#t-sym"),box=$("#t-fxbox"),p=S.pf.find(x=>x.id===pid);if(!sel||!box||!p)return;
  const X=ccyOf(sel.value)||p.cur,diff=X!==p.cur,cash=["div","fee"].includes($("#t-type").value);
  box.style.display=diff&&!cash?"":"none";$("#t-pl").textContent="Cena za sztukę ("+X+")";$("#t-fxl").textContent="Kurs "+X+"/"+p.cur+" z dnia ruchu";
  const q=num($("#t-qty").value),pr=num($("#t-price").value),f=num($("#t-fx").value),m=num($("#t-mg").value)||0,tot=num($("#t-tot").value);
  $("#t-prev").textContent=diff&&q>0&&pr>=0&&(f>0||tot>0)?"Koszt w "+p.cur+": "+money(tot>0?tot:q*pr*f*(1+m/100),p.cur):""};
document.addEventListener("input",e=>{if(["t-qty","t-price","t-fx","t-mg","t-tot"].includes(e.target.id))fxSync()});
document.addEventListener("change",e=>{if(["t-sym","t-type"].includes(e.target.id))fxSync()});
document.addEventListener("click",e=>{
  if(e.target.classList&&e.target.classList.contains("ov")){modal=null;editId=txEdit=bEdit=peEdit=depEdit=null;render();return}
  const t=e.target.closest("[data-open],[data-close],[data-tog],[data-addtx],[data-cpimiss],[data-bpaid],[data-ppadd],[data-ppesave],[data-ppfirst],[data-ppauto],[data-depsave],[data-depedit],[data-depdel]");if(!t)return;const d=t.dataset;
  if("close" in d){modal=null;editId=txEdit=bEdit=peEdit=depEdit=null;render()}
  else if(d.open){modal=d.open;editId=txEdit=bEdit=peEdit=depEdit=null;txSym="";cpiKey="";render()}
  else if(d.tog){ui[d.tog]=!ui[d.tog];render()}
  else if(d.addtx){txSym=d.addtx;txEdit=null;modal="tx";render()}
  else if(d.cpimiss){cpiKey=d.cpimiss;modal="cpi";render()}
  else if("ppauto" in d){S.ppk={...S.ppk,override:false};save()}
  else if(d.depedit){depEdit=d.depedit;modal="dep";render()}
  else if("depdel" in d){if(confirm("Usunąć tę wpłatę?")){S.dep=S.dep.filter(x=>x.id!==depEdit);depEdit=null;save()}}
  else if("depsave" in d){const pf=S.pf.find(x=>x.id===pid),date=$("#d-date").value,amount=num($("#d-amount").value),cu=$("#d-cur").value,fx=num($("#d-fx").value),X=cu!=="PLN"?cu:(pf.cur!=="PLN"?pf.cur:null);
    if(!date||!(amount>0)){alert("Wpisz datę i kwotę wpłaty.");return}
    if(cu!==pf.cur&&cu!=="PLN"&&pf.cur!=="PLN"){alert("Wpłata w innej walucie niż portfel jest obsługiwana tylko przez PLN.");return}
    if(X&&!(fx>0)){alert("Podaj kurs z dnia wpłaty (PLN za 1 "+X+").");return}
    const rec={id:depEdit||String(Date.now()),pid,date,amount,cur:cu,fx:X?fx:1};
    S.dep=depEdit?S.dep.map(x=>x.id===depEdit?rec:x):[...S.dep,rec];depEdit=null;save()}
  else if(d.bpaid){const b=S.bonds.find(x=>x.id===d.bpaid),due=b&&payDue(b);if(due){b.paid=dd(due);S.bonds=[...S.bonds];save()}}
  else if(d.ppfirst!==undefined){S.ppk={...S.ppk,first:$("#pp-first").value};save()}
  else if(d.ppadd){const k=d.ppadd,a=num($("#pa-"+k+"-a").value),u=num($("#pa-"+k+"-u").value);
    if(!a||!u){alert("Wpisz kwotę i ilość jednostek (kwota z minusem odejmuje wpłatę).");return}
    S.ppk={...S.ppk,e:[...S.ppk.e,{id:String(Date.now()),date:today(),src:k,amount:a,units:Math.abs(u)*Math.sign(a)}]};save()}
  else if(d.ppesave){const k=d.ppesave,a=num($("#pe-"+k+"-a").value),u=num($("#pe-"+k+"-u").value);
    if(!(a>=0)||!(u>=0)){alert("Wpisz sumę wpłat i jednostek (zero lub więcej).");return}
    const old=S.ppk.e.filter(x=>x.src===k),dt=old.length?old.map(x=>x.date).sort()[0]:today();
    S.ppk={...S.ppk,e:[...S.ppk.e.filter(x=>x.src!==k),...(a>0||u>0?[{id:String(Date.now()),date:dt,src:k,amount:a,units:u}]:[])]};save()}});

document.addEventListener("change",e=>{if(e.target.id==="d-cur"){const pf=S.pf.find(x=>x.id===pid),cu=e.target.value,X=cu!=="PLN"?cu:(pf.cur!=="PLN"?pf.cur:null);
  $("#d-fxbox").style.display=X?"":"none";$("#d-fxl").textContent="Kurs z dnia wpłaty (PLN za 1 "+(X||"")+")"}});

function viewSoon(n){return `<div class="card"><b>${n}</b><p class="mu">Ten dział dodamy w następnym kroku.</p></div>`}

function render(){const app=$("#app");
  if(!booted){app.innerHTML=`<p class="mu" style="padding:24px">Ładowanie…</p>`;return}
  if(!user){app.innerHTML=`<form class="login" id="lf"><h1>Portfel</h1><p class="mu">Zaloguj się wspólnym kontem aplikacji.</p>
    <label>E-mail</label><input id="l-mail" type="email" value="${EMAIL}" autocomplete="username">
    <label>Hasło</label><input id="l-pass" type="password" autocomplete="current-password">
    ${loginErr?`<p class="bad">${esc(loginErr)}</p>`:""}<button type="submit" style="width:100%">Zaloguj</button></form>`;return}
  const body=tab==="all"?viewAll():tab==="sav"?viewSav():tab==="stk"?viewStk():tab==="bnd"?viewBnd():viewPpk();
  const tabs=[["all","Wszystko"],["sav","Konta"],["stk","Akcje"],["bnd","Obligacje"],["ppk","PPK"]];
  app.innerHTML=`<header><h1>Portfel</h1></header>
   <div class="st">${tab==="all"?esc(info):""}${err?` <span class="bad">${esc(err)}</span>`:""}</div><main>${body}</main>
   <nav>${tabs.map(([k,n])=>`<button data-tab="${k}" class="${k===tab?"on":""}">${n}</button>`).join("")}</nav>`}

document.addEventListener("submit",async e=>{
  if(e.target.id!=="lf")return;e.preventDefault();loginErr="";
  try{await signInWithEmailAndPassword(auth,$("#l-mail").value.trim(),$("#l-pass").value)}
  catch(x){loginErr=["auth/invalid-credential","auth/wrong-password","auth/user-not-found"].includes(x.code)?"Błędny e-mail lub hasło.":"Nie udało się zalogować ("+x.code+").";render()}});

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-edit],[data-save],[data-cancel],[data-del],[data-out]");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;editId=null;modal=null;render()}
  else if(t.dataset.edit){editId=t.dataset.edit;modal="acc";render()}
  else if("cancel" in t.dataset){editId=null;render()}
  else if("out" in t.dataset){signOut(auth)}
  else if("del" in t.dataset){if(confirm("Usunąć to konto z listy?")){S.accounts=S.accounts.filter(x=>x.id!==editId);editId=null;save()}}
  else if("save" in t.dataset){
    const name=$("#f-name").value.trim(),cur=$("#f-cur").value.trim().toUpperCase(),amount=num($("#f-amount").value);
    if(!name||cur.length!==3||isNaN(amount)){alert("Uzupełnij nazwę, trzyliterową walutę (np. PLN) i saldo.");return}
    const rec={id:editId||String(Date.now()),name,owner:$("#f-owner").value,cur,amount};
    S.accounts=editId?S.accounts.map(x=>x.id===editId?rec:x):[...S.accounts,rec];editId=null;save()}});

onAuthStateChanged(auth,u=>{user=u;booted=true;
  if(unsub){unsub();unsub=null}
  if(u){
    unsub=onSnapshot(doc(db,"data","state"),s=>{S=s.exists()?s.data():{accounts:[]};S.accounts=S.accounts||[];S.pf=S.pf||[];S.tx=S.tx||[];S.bonds=S.bonds||[];S.dep=S.dep||[];S.infl=S.infl||[];S.ppk=Object.assign({price:0,pdate:"",fund:"",first:"",override:false,e:[]},S.ppk||{});const ow=o=>o==="Kuba"?"Jakub":o==="Żona"?"Beata":o;[S.accounts,S.pf,S.bonds].forEach(a=>a.forEach(x=>x.owner=ow(x.owner)));if(S.bonds.some(b=>!b.cap&&!b.paid)){S.bonds.forEach(b=>{if(!b.cap&&!b.paid)b.paid=dd(lastPast(b))});save()}err="";render()},
      e=>{err="Brak dostępu do bazy: "+e.code;render()});
    loadRates()}
  render()});
render();
</script>
