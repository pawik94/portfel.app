<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b3a67">
<title>Portfel</title>
<style>
:root{--bg:#eceff3;--card:#fff;--tx:#18202c;--mu:#5d6878;--ac:#2b3a67;--ac2:#e8ebf5;--bd:#d9dee6;--bad:#b42318;--c1:#2b3a67;--c2:#1f8a7a;--c3:#c9822b;--c4:#8e5db5;--good:#15803d;--card2:#f4f6fa;--tile:#f6f8fc;--hi:rgba(255,255,255,.95);--sh:rgba(28,40,70,.12);--c5:#d0556a;--c6:#3d8ed4}
@media(prefers-color-scheme:dark){:root{--bg:#10141b;--card:#1a212b;--tx:#e7ebf1;--mu:#9aa5b5;--ac:#9fb1f0;--ac2:#232c3d;--bd:#2a3340;--bad:#f97066;--c1:#9fb1f0;--c2:#4fc3b0;--c3:#f0b25e;--c4:#c39be6;--good:#4ade80;--card2:#161d26;--tile:#202935;--hi:rgba(255,255,255,.07);--sh:rgba(0,0,0,.5);--c5:#f08aa0;--c6:#7ab8f0}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:flex-start;gap:14px;padding:14px 16px 6px;max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0}
.st{font-size:12px;color:var(--mu);padding:0 16px 8px;max-width:720px;margin:0 auto}
main{max-width:720px;margin:0 auto;padding:8px 16px}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:inset 0 1px 0 var(--hi),0 8px 20px var(--sh),0 1px 3px var(--sh)}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.mu{color:var(--mu);font-size:14px}.bad{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.row b{font-variant-numeric:tabular-nums;text-align:right}
button,input,select{font:inherit;color:inherit}
button{background:var(--ac);background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 86%,#fff),var(--ac));color:var(--card);border:0;border-radius:10px;padding:10px 14px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 8px var(--sh)}
button.ghost{background:var(--tile);color:var(--ac);border:1px solid var(--bd);box-shadow:inset 0 1px 0 var(--hi),0 2px 6px var(--sh)}
button.danger{background:var(--tile);color:var(--bad);border:1px solid var(--bd);box-shadow:none}
input,select{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{width:100%;text-align:left;background:var(--tile);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;margin:0 0 8px;display:flex;justify-content:space-between;gap:10px;box-shadow:inset 0 1px 0 var(--hi),0 3px 8px var(--sh)}
.nv{display:flex;gap:7px}
.ib{width:40px;height:40px;padding:0;display:grid;place-items:center;background:var(--tile);color:var(--mu);border:1px solid var(--bd);border-radius:11px;box-shadow:inset 0 1px 0 var(--hi),0 3px 8px var(--sh)}
.ib svg{width:23px;height:23px}
.ib.on{background:var(--ac);color:var(--card);border-color:transparent}
.pil{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.pl{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:12px 12px 11px;border-radius:16px;border:1px solid var(--bd);border-top:4px solid var(--tc);background:linear-gradient(160deg,var(--card),var(--card2));color:var(--tx);box-shadow:inset 0 1px 0 var(--hi),0 10px 20px var(--sh),0 2px 4px var(--sh);transition:transform .08s,box-shadow .08s}
.pl:active{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--hi),0 2px 6px var(--sh)}
.pn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.pn svg{width:19px;height:19px;color:var(--tc);flex:none}
.pv{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.pp{font-size:13px;font-weight:700;color:var(--tc)}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:12px;color:var(--mu)}
.mts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:10px 0}
.mts.two{grid-template-columns:1fr 1fr}
.mt{background:var(--tile);border:1px solid var(--bd);border-radius:12px;padding:9px 11px;box-shadow:inset 0 1px 0 var(--hi),0 3px 8px var(--sh)}
.ml{font-size:12px;color:var(--mu);line-height:1.25}
.mv{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.mts.two .mv{font-size:21px}
.ms{margin-top:2px}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
 .good{color:var(--good)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;overflow:auto;padding:12px}
.sh{max-width:560px;margin:2vh auto;background:var(--bg);border-radius:12px;padding:8px 10px 2px}
.sub{padding:0 0 6px 10px;border-left:2px solid var(--bd);margin-left:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.nb{white-space:nowrap}
.big{font-size:clamp(24px,8.4vw,34px);white-space:nowrap}
.row>:first-child{min-width:0}
.row>:last-child{white-space:nowrap;text-align:right}
.item>span:first-child{min-width:0}
.item>span:last-child{white-space:nowrap;text-align:right;flex:none}
.mv{font-size:clamp(14px,4.4vw,17px);white-space:nowrap;overflow-wrap:normal}
.mts.two .mv{font-size:clamp(15px,4.8vw,20px)}
.mts>.mt:first-child:nth-last-child(3){grid-column:1/-1}
.pv{font-size:clamp(14px,4.6vw,19px);white-space:nowrap}
.pp{white-space:nowrap}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);align-items:center;justify-content:center;padding:20px}
.lk{width:100%;max-width:320px;text-align:center}
.dots{display:flex;justify-content:center;gap:14px;margin:16px 0 24px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ac)}
.dots i.f{background:var(--ac)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kp button{height:64px;font-size:24px;font-weight:600;border-radius:16px;background:var(--tile);color:var(--tx);border:1px solid var(--bd);box-shadow:inset 0 1px 0 var(--hi),0 4px 10px var(--sh);padding:0}
.kp button.sm{font-size:12px;font-weight:500;color:var(--mu)}
</style>
</head>
<body>
<div id="app"></div>
<div id="lock" class="lock" style="display:none"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBSJNAmWuu4SGu1D25rkJrrn6L0CzOmKds",
  authDomain:"portfel-7c77f.firebaseapp.com",
  projectId:"portfel-7c77f",
  storageBucket:"portfel-7c77f.firebasestorage.app",
  messagingSenderId:"954590394780",
  appId:"1:954590394780:web:0b635ea8a6bf48409bf059"
};
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRmNNUaIptQmyWUjvLpJf6oeRlft0DVEbXqoXA0CzfowQizt9uNzR4WFDZT1qW0YCuG9-6RLune9e1C/pub?gid=0&single=true&output=csv";
const EMAIL="portfel.app@portfel.pl";
const OWNERS=["Jakub","Beata","Wspólne"];

const auth=getAuth(initializeApp(firebaseConfig));
const db=getFirestore(auth.app);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=s=>{const n=parseFloat(String(s).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:NaN};
const money=(v,c)=>{let r;try{r=new Intl.NumberFormat("pl-PL",{style:"currency",currency:c}).format(v)}catch(e){r=v.toFixed(2)+" "+c}return r.replace(/\s/g,"\u00a0")};

let user=null,S={accounts:[],pf:[],tx:[],bonds:[],infl:[],ppk:{price:0,pdate:"",e:[]},dep:[]},tab="all",editId=null,err="",loginErr="",rates={PLN:1},quotes={},info="",unsub=null,booted=false;

function parseCsv(t){const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==","){r.push(f);f=""}
    else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);rows.push(r);r=[];f=""}
    else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}return rows}

function applyRows(rows){rates={PLN:1};quotes={};
  for(const r of rows){const s=r[0];if(!s)continue;const four=r.length>=4,name=four?r[1]:"",k=four?r[2]:r[1],w=four?r[3]:r[2];
    const m=s.match(/^CURRENCY:([A-Z]{3})PLN$/);
    if(m){const n=num(k);if(n>0)rates[m[1]]=n}
    else quotes[s]={sym:s,raw:k,name:name||s,price:num(k),fx:num(w)}}}

async function loadRates(){
  try{const res=await fetch(CSV_URL,{cache:"no-store"});if(!res.ok)throw new Error("http");
    const rows=parseCsv(await res.text()).slice(1);applyRows(rows);
    localStorage.setItem("rows",JSON.stringify({t:Date.now(),rows}));
    info="Kursy pobrane: "+new Date().toLocaleString("pl-PL")}
  catch(e){try{const c=JSON.parse(localStorage.getItem("rows"));applyRows(c.rows);
      info="Nie udało się pobrać kursów, pokazuję zapisane z "+new Date(c.t).toLocaleString("pl-PL")}
    catch(_){info="Brak kursów: nie udało się pobrać arkusza"}}
  render()}

async function save(){modal=null;
  try{await setDoc(doc(db,"data","state"),{accounts:S.accounts,pf:S.pf,tx:S.tx,bonds:S.bonds,infl:S.infl,ppk:S.ppk,dep:S.dep},{merge:true});err=""}
  catch(e){err="Nie zapisano: "+e.code}
  render()}

function totals(){let t=0;const by={},miss=new Set();
  OWNERS.forEach(o=>by[o]=0);
  for(const a of S.accounts){const r=rates[a.cur];
    if(!r){miss.add(a.cur);continue}
    const v=a.amount*r;t+=v;by[a.owner]=(by[a.owner]||0)+v}
  return{t,by,miss:[...miss]}}

function warn(tt){return tt.miss.length?`<p class="bad">Brak kursu do PLN dla: ${tt.miss.map(esc).join(", ")}. Te konta nie są wliczone. Dodaj w arkuszu wiersz CURRENCY:${esc(tt.miss[0])}PLN.</p>`:""}

const ico={
 home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>`,
 bank:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5"/><path d="M4.5 9.5h15"/><path d="M6.5 12v6M10 12v6M14 12v6M17.5 12v6"/><path d="M3.5 20h17"/></svg>`,
 chart:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4v16h17"/><path d="M7 15.5l3.5-4.2 3 2.4 4.5-6"/><path d="M15 7.5h3v3"/></svg>`,
 note:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6.5" width="19" height="11" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5h.01M18 14.5h.01"/></svg>`,
 ppk:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3.5"/><text x="12" y="14.7" text-anchor="middle" font-size="7.4" font-weight="800" fill="currentColor" stroke="none" font-family="system-ui,sans-serif">PPK</text></svg>`};
const NAV=[["all","Strona główna",ico.home],["sav","Konta",ico.bank],["stk","Akcje",ico.chart],["bnd","Obligacje",ico.note],["ppk","PPK",ico.ppk]];

function donut(parts,total,label){const tot=parts.reduce((a,p)=>a+p.v,0);if(!(tot>0))return `<p class="mu">Brak danych do wykresu.</p>`;
  let off=25,cum=0,segs="",lab="";
  for(const p of parts){if(!(p.v>0))continue;const q=p.v/tot*100,l=Math.max(q-0.9,0.1),da=`${l} ${100-l}`,o=off-0.45;
    segs+=`<circle ${p.t?`data-tab="${p.t}" style="cursor:pointer"`:""} r="15.9155" cx="21" cy="21" fill="none" stroke="var(${p.c})" stroke-width="7" stroke-dasharray="${da}" stroke-dashoffset="${o}"><title>${esc(p.n)}</title></circle><circle r="15.9155" cx="21" cy="21" fill="none" stroke="url(#shine)" stroke-width="7" stroke-dasharray="${da}" stroke-dashoffset="${o}" pointer-events="none"/>`;
    if(q>=6){const a=(cum+q/2)/100*2*Math.PI-Math.PI/2;lab+=`<text x="${21+15.9155*Math.cos(a)}" y="${21+15.9155*Math.sin(a)}" text-anchor="middle" dominant-baseline="central" font-size="3.2" font-weight="800" fill="#fff" pointer-events="none">${Math.round(q)}%</text>`}
    off-=q;cum+=q}
  const s=Math.round(total).toLocaleString("pl-PL")+" zł",fs=s.length>10?2.7:3.4;
  return `<svg viewBox="0 0 42 42" role="img" aria-label="Podział aktywów, razem ${esc(money(total,"PLN"))}" style="width:270px;max-width:82%;display:block;margin:2px auto 10px;overflow:visible">
   <defs><linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
   <filter id="ds" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#000" flood-opacity=".35"/></filter></defs>
   <g filter="url(#ds)">${segs}</g><circle cx="21" cy="21" r="11.9" fill="var(--card)" stroke="var(--bd)" stroke-width=".3"/>${lab}
   <text x="21" y="19.4" text-anchor="middle" font-size="2.5" fill="var(--mu)">${esc(label||"Razem")}</text><text x="21" y="24" text-anchor="middle" font-size="${fs}" font-weight="800" fill="var(--tx)">${s}</text></svg>`}

function viewAll(){const tt=totals(),sk=stkTotals(),bt=bondTotals(),pk=ppkCalc(),pv=pk.value,sv=tt.t,total=sv+sk.pln+bt.value+pv;
  const parts=[{n:"Oszczędności",v:sv,c:"--c1",t:"sav",i:ico.bank},{n:"Akcje",v:sk.pln,c:"--c2",t:"stk",i:ico.chart},{n:"Obligacje",v:bt.value,c:"--c3",t:"bnd",i:ico.note},{n:"PPK",v:pv,c:"--c4",t:"ppk",i:ico.ppk}];
  const pc=v=>total>0?(v/total*100).toFixed(1).replace(".",",")+"\u00a0%":"–";
  const own=pk.src.own.c,gAll=sk.gain+(bt.value-bt.invOwn)+(pv-own),bAll=sk.base+bt.invOwn+own,fAll=[sk.first,bt.firstOwn,pk.first].filter(Boolean).sort()[0]||"";
  const lead=tile("Wynik",sg(gAll,"PLN"));
  const cb=ccyBreakdown(),cT=cb.reduce((a,x)=>a+x[1],0),cc=["--c1","--c2","--c3","--c4","--c5","--c6"],cparts=cb.map(([k,v],i)=>({n:k,v,c:cc[i%6]}));
  const ccyCard=cT>0?`<div class="card" style="text-align:center"><b>Podział według waluty</b>${donut(cparts,cT,"Waluty")}${cb.map(([k,v],i)=>`<div class="row" style="text-align:left"><span><i class="dot" style="background:var(${cc[i%6]})"></i>${esc(k)}</span><b>${money(v,"PLN")} <span class="mu">${(v/cT*100).toFixed(1).replace(".",",")}\u00a0%</span></b></div>`).join("")}</div>`:"";
  return `<div class="card" style="text-align:center">${donut(parts,total)}<div class="lg">${parts.map(x=>`<span><i class="dot" style="background:var(${x.c})"></i>${x.n} ${pc(x.v)}</span>`).join("")}</div>${warn({miss:[...new Set([...tt.miss,...sk.miss])]})}</div>
  <div class="pil">${parts.map(x=>`<button class="pl" data-tab="${x.t}" style="--tc:var(${x.c})"><span class="pn">${x.i}${x.n}</span><span class="pv">${money(x.v,"PLN")}</span><span class="pp">${pc(x.v)}</span></button>`).join("")}</div>
  ${ccyCard}
  <div class="card"><b>Inwestycje razem, od moich wpłat</b>${fAll&&bAll>0?retRows(gAll/bAll,fAll,undefined,undefined,lead):tiles([lead])}
   <p class="mu">Podstawą są Twoje wpłaty: do portfeli akcji, obligacje kupione z własnych środków i własne wpłaty do PPK. Reinwestowane odsetki oraz wpłaty pracodawcy i państwa liczą się jako zysk.</p></div>
  <div class="g2" style="margin-bottom:12px"><button class="ghost" data-bak>Kopia danych</button><button class="ghost" data-out>Wyloguj</button></div>
  <button class="ghost" data-tog="set" style="width:100%;margin-bottom:12px">Ustawienia ${ui.set?"▲":"▼"}</button>
  ${ui.set?`<div class="card"><b>Blokada PIN-em</b><p class="mu">Na tym urządzeniu: ${pinCfg()?"włączona":"wyłączona"}. PIN blokuje wejście do aplikacji i włącza się ponownie po chwili w tle.</p><button data-open="pin" style="width:100%">${pinCfg()?"Zmień lub wyłącz PIN":"Ustaw PIN"}</button></div>
  <div class="card"><b>Przywracanie danych</b><p class="mu">Wybierz plik z „Kopia danych”. Zastąpi wszystkie obecne dane. Przed tym pobiorę kopię obecnych.</p><input id="rs-file" type="file" accept=".json,application/json"></div>`:""}
  ${modal==="pin"?sheet(pinForm()):""}`}

function viewSav(){const tt=totals();
  const a=S.accounts.find(x=>x.id===editId)||{name:"",owner:OWNERS[0],cur:"PLN",amount:""};
  const list=S.accounts.length?S.accounts.map(x=>{const r=rates[x.cur];
    return `<button class="item" data-edit="${esc(x.id)}"><span>${esc(x.name)}<br><span class="mu">${esc(x.owner)}</span></span><span style="text-align:right"><b>${money(x.amount,x.cur)}</b>${x.cur!=="PLN"&&r?`<br><span class="mu">≈ ${money(x.amount*r,"PLN")}</span>`:""}</span></button>`}).join(""):`<p class="mu">Nie ma jeszcze żadnych kont.</p>`;
  const form=`<div class="card"><b>${editId?"Edytuj konto":"Dodaj konto"}</b>
   <label>Nazwa (np. Revolut, ING oszczędnościowe)</label><input id="f-name" value="${esc(a.name)}">
   <div class="g2"><div><label>Właściciel</label><select id="f-owner">${OWNERS.map(o=>`<option${o===a.owner?" selected":""}>${o}</option>`).join("")}</select></div>
   <div><label>Waluta</label><select id="f-cur">${[...new Set([...CURS,a.cur])].map(c=>`<option${c===a.cur?" selected":""}>${c}</option>`).join("")}</select></div></div>
   <label>Saldo</label><input id="f-amount" inputmode="decimal" value="${a.amount===""?"":String(a.amount).replace(".",",")}">
   <button data-save style="width:100%">Zapisz konto</button>
   ${editId?`<p><button class="danger" data-del>Usuń to konto</button></p>`:""}</div>`;
  return `<div class="card"><div class="mu">Suma w PLN</div><div class="big">${money(tt.t,"PLN")}</div>${warn(tt)}</div><div class="card">${list}</div><button data-open="acc" style="width:100%">+ Dodaj konto</button>${modal==="acc"?sheet(form):""}`}

const CURS=["PLN","EUR","USD","GBP","CHF","CZK","SEK","NOK","DKK","HUF","CAD","AUD","JPY"];
let pid="all",txEdit=null;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const pct=v=>isFinite(v)?`<span class="nb ${v<0?"bad":v>0?"good":""}">${v>=0?"+":""}${(v*100).toFixed(2).replace(".",",")}&nbsp;%</span>`:"–";
const sg=(v,c)=>`<span class="nb ${v<0?"bad":v>0?"good":""}">${v>0?"+":""}${money(v,c)}</span>`;
const fq=n=>String(Math.round(n*1e6)/1e6).replace(".",",");
const TL={buy:"Zakup",sell:"Sprzedaż",div:"Dywidenda",fee:"Opłata"};

let modal=null,ui={},txSym="",cpiKey="",depEdit=null;
const sheet=h=>`<div class="ov"><div class="sh"><div style="text-align:right"><button class="ghost" data-close>Zamknij</button></div>${h}</div></div>`;
const nm=x=>quotes[x]?quotes[x].name:x;
const rt=c=>c==="PLN"?1:rates[c];
function ccyOf(sym){const q=quotes[sym];if(!q||!(q.fx>0))return null;if(Math.abs(q.fx-1)<1e-9)return "PLN";for(const c in rates)if(c!=="PLN"&&Math.abs(rates[c]/q.fx-1)<0.003)return c;return null}
const effFx=t=>{const f=t.fx>0?t.fx:1,m=(t.mg||0)/100;return t.type==="sell"?f*(1-m):f*(1+m)};

function calc(p){const pos={};let fees=0,divs=0,buys=0,realized=0,first="",sold=0;
  const txs=S.tx.filter(t=>t.pid===p.id).sort((a,b)=>a.date===b.date?(a.id<b.id?-1:1):(a.date<b.date?-1:1));
  for(const t of txs){
    if(!t.sym){fees+=t.amount||0;continue}
    const P=pos[t.sym]||(pos[t.sym]={sym:t.sym,qty:0,cost:0,costX:0});
    if(t.type==="buy"){const c=(t.tot>0?t.tot:t.qty*t.price*effFx(t))+(t.fee||0);P.qty+=t.qty;P.cost+=c;P.costX+=t.qty*t.price;buys+=c;if(!first||t.date<first)first=t.date;if(!P.first||t.date<P.first)P.first=t.date}
    else if(t.type==="sell"){const avg=P.qty>0?P.cost/P.qty:0,avgX=P.qty>0?P.costX/P.qty:0,pr=(t.tot>0?t.tot:t.qty*t.price*effFx(t))-(t.fee||0);
      realized+=pr-t.qty*avg;sold+=pr;P.cost-=t.qty*avg;P.costX-=t.qty*avgX;P.qty-=t.qty}
    else if(t.type==="div")divs+=t.amount||0;
    else if(t.type==="fee")fees+=t.amount||0}
  const open=[],miss=[],neg=[];let value=0,unreal=0;
  for(const P of Object.values(pos)){if(Math.abs(P.qty)<1e-9)continue;
    if(P.qty<0)neg.push(P.sym);
    const q=quotes[P.sym],pr=q&&q.price>0?q.price:NaN,X=ccyOf(P.sym)||p.cur,k=X===p.cur?1:(rt(X)&&rt(p.cur)?rt(X)/rt(p.cur):NaN);
    P.ccy=X;P.avg=P.qty?P.cost/P.qty:0;P.avgX=P.qty?P.costX/P.qty:0;P.price=pr;
    if(isNaN(pr)||isNaN(k))miss.push(P.sym);else{P.value=P.qty*pr*k;P.gain=P.value-P.cost;value+=P.value;unreal+=P.gain}
    open.push(P)}
  const gain=unreal+realized+divs-fees;
  const f=rates[p.cur]||open.map(x=>quotes[x.sym]&&quotes[x.sym].fx).find(v=>v>0);
  return{open,miss,neg,value,unreal,realized,divs,fees,gain,buys,sold,first,ret:buys>0?gain/buys:NaN,f}}

function depTotal(){let dPLN=0,first="";for(const d of S.dep){dPLN+=d.cur==="PLN"?d.amount:d.amount*(d.fx>0?d.fx:1);if(!first||d.date<first)first=d.date}return{dPLN,first}}

function stkEquity(){let valuePLN=0,buys=0,sold=0,divs=0,fees=0,gainP=0,baseP=0,first="";const miss=new Set();
  for(const p of S.pf){const c=calc(p);if(!c.f){miss.add(p.cur);continue}
    valuePLN+=c.value*c.f;buys+=c.buys*c.f;sold+=c.sold*c.f;divs+=c.divs*c.f;fees+=c.fees*c.f;gainP+=c.gain*c.f;baseP+=c.buys*c.f;
    if(c.first&&(!first||c.first<first))first=c.first}
  const D=depTotal();
  if(D.dPLN>0){const cash=D.dPLN-buys+sold+divs-fees,eq=valuePLN+Math.max(cash,0);return{valuePLN,gain:eq-D.dPLN,base:D.dPLN,first:D.first,dep:true,miss:[...miss]}}
  return{valuePLN,gain:gainP,base:baseP,first,dep:false,miss:[...miss]}}

function stkTotals(){let pln=0;const by={};
  for(const p of S.pf){const c=calc(p);if(!c.f)continue;pln+=c.value*c.f;by[p.owner]=(by[p.owner]||0)+c.value*c.f}
  const e=stkEquity();return{pln,gain:e.gain,base:e.base,first:e.first,by,miss:e.miss}}

function stkAll(){const e=stkEquity();let h="";
  for(const p of S.pf){const c=calc(p);if(!c.f)continue;
    h+=`<button class="item" data-pfgo="${esc(p.id)}"><span>${esc(p.name)}<br><span class="mu">${esc(p.owner)}, ${esc(p.cur)}</span></span><span style="text-align:right"><b>${money(c.value*c.f,"PLN")}</b><br>${sg(c.gain*c.f,"PLN")} (${pct(c.ret)})</span></button>`}
  return `<div class="card"><div class="mu">Wszystkie portfele w PLN</div><div class="big">${money(e.valuePLN,"PLN")}</div>
   ${e.first?retRows(e.base>0?e.gain/e.base:NaN,e.first,e.dep?"Stopa zwrotu od wpłat":"Stopa zwrotu",undefined,tile("Wynik łącznie",sg(e.gain,"PLN"))):tiles([tile("Wynik łącznie",sg(e.gain,"PLN"))])}
   ${e.dep?"":`<p class="mu">Dodaj wpłaty (przycisk u góry), żeby stopa zwrotu liczyła się od wpłat, a nie od zakupów (w których są reinwestowane zyski).</p>`}
   ${e.miss.length?`<p class="bad">Brak kursu do PLN dla: ${e.miss.map(esc).join(", ")}. Te portfele nie są wliczone.</p>`:""}</div><div class="card">${h}</div>`}

function depForm(){const e=S.dep.find(x=>x.id===depEdit)||{date:today(),amount:"",cur:"PLN",fx:""};
  return `<div class="card"><b>${depEdit?"Edytuj wpłatę":"Dodaj wpłatę"}</b><p class="mu">Wpłaty dotyczą całości akcji (wszystkich portfeli), więc przeniesienia między portfelami nie psują stopy zwrotu.</p>
   <div class="g2"><div><label>Data</label><input id="d-date" type="date" value="${esc(e.date)}"></div><div><label>Kwota</label><input id="d-amount" inputmode="decimal" value="${vv(e.amount)}"></div></div>
   <div class="g2"><div><label>Waluta wpłaty</label><select id="d-cur">${[...new Set(["PLN",...CURS,e.cur])].map(k=>`<option${k===e.cur?" selected":""}>${k}</option>`).join("")}</select></div>
   <div id="d-fxbox" style="display:${e.cur!=="PLN"?"":"none"}"><label id="d-fxl">Kurs z dnia wpłaty (PLN za 1 ${esc(e.cur)})</label><input id="d-fx" inputmode="decimal" value="${vv(e.fx&&Math.abs(e.fx-1)>1e-7?e.fx:"")}"></div></div>
   <button data-depsave style="width:100%">Zapisz wpłatę</button>${depEdit?`<p><button class="danger" data-depdel>Usuń wpłatę</button></p>`:""}</div>`}

function depList(){const d=[...S.dep].sort((a,b)=>a.date===b.date?(a.id<b.id?1:-1):(a.date<b.date?1:-1)),tot=depTotal();
  return d.length?`<button class="ghost" data-tog="deps" style="width:100%;margin-bottom:12px">Wpłaty do akcji (${d.length}), razem ${money(tot.dPLN,"PLN")} ${ui.deps?"▲":"▼"}</button>${ui.deps?`<div class="card">${d.map(x=>`<button class="item" data-depedit="${esc(x.id)}"><span>${esc(x.date)}</span><span style="text-align:right">${money(x.amount,x.cur)}${x.cur!=="PLN"&&x.fx>0?`<br><span class="mu">kurs ${vv(x.fx)}</span>`:""}</span></button>`).join("")}</div>`:""}`:""}

function viewStk(){
  if(!S.pf.length)pid="";else if(pid==="all"&&S.pf.length===1)pid=S.pf[0].id;else if(pid!=="all"&&!S.pf.find(p=>p.id===pid))pid="all";
  const one=pid&&pid!=="all";
  const top=`<div class="g2" style="margin-bottom:12px"><button data-open="pf">+ Nowy portfel</button><button data-open="dep">+ Dodaj wpłatę</button></div>${one?`<button data-open="tx" style="width:100%;margin-bottom:12px">+ Dodaj ruch</button>`:""}`;
  const pfForm=`<div class="card"><b>Nowy portfel</b><label>Nazwa</label><input id="p-name" placeholder="np. IKE">
   <div class="g2"><div><label>Właściciel</label><select id="p-owner">${OWNERS.map(o=>`<option>${o}</option>`).join("")}</select></div>
   <div><label>Waluta portfela</label><select id="p-cur">${CURS.map(c=>`<option>${c}</option>`).join("")}</select></div></div>
   <button data-addpf style="width:100%">Dodaj portfel</button></div>`;
  const mod=(modal==="pf"?sheet(pfForm):"")+(modal==="dep"?sheet(depForm()):"");
  const sel=S.pf.length?`<select data-pfsel>${S.pf.length>1?`<option value="all"${pid==="all"?" selected":""}>Wszystkie portfele (w PLN)</option>`:""}${S.pf.map(p=>`<option value="${esc(p.id)}"${p.id===pid?" selected":""}>${esc(p.name)} (${esc(p.cur)})</option>`).join("")}</select>`:"";
  if(!S.pf.length)return top+depList()+`<div class="card"><p class="mu">Nie ma jeszcze portfeli. Dodaj pierwszy, np. IKE w PLN albo portfel w USD.</p></div>`+mod;
  if(pid==="all")return top+depList()+sel+stkAll()+mod;
  const p=S.pf.find(x=>x.id===pid),c=calc(p),cur=p.cur;
  const desc=(a,b)=>a.date===b.date?(a.id<b.id?1:-1):(a.date<b.date?1:-1);
  const txItem=t=>{const X=ccyOf(t.sym)||cur;return `<button class="item" data-txedit="${esc(t.id)}"><span>${esc(t.date)}, ${TL[t.type]}<br><span class="mu">${esc(t.sym?nm(t.sym):"")}</span></span><span style="text-align:right">${t.type==="buy"||t.type==="sell"?`${fq(t.qty)} × ${money(t.price,X)}${t.fx>0&&Math.abs(t.fx-1)>1e-7?`<br><span class="mu">kurs ${vv(t.fx)}${t.mg?`, marża ${vv(t.mg)}%`:""}</span>`:""}`:money(t.amount,cur)}</span></button>`};
  const glob=S.pf.length===1?stkEquity():null,useD=!!(glob&&glob.dep),gC=useD?"PLN":cur,gT=useD?glob.gain:c.gain,rT=useD?(glob.base>0?glob.gain/glob.base:NaN):c.ret,fT=useD?glob.first:c.first;
  const head=`<div class="card"><div class="mu">Wartość portfela</div><div class="big">${money(c.value,cur)}</div>${cur!=="PLN"&&c.f?`<div class="mu">≈ ${money(c.value*c.f,"PLN")}</div>`:""}
   ${fT?retRows(rT,fT,useD?"Stopa zwrotu od wpłat":"Stopa zwrotu",undefined,tile("Wynik łącznie",sg(gT,gC))):tiles([tile("Wynik łącznie",sg(gT,gC))])}
   ${S.pf.length===1&&!useD?`<p class="mu">Dodaj wpłaty (przycisk u góry), żeby stopa zwrotu liczyła się od wpłat, a nie od zakupów.</p>`:""}${S.pf.length>1&&S.dep.length?`<p class="mu">Stopa zwrotu od wpłat dla całości jest w widoku „Wszystkie portfele”. Tu liczy się od zakupów w tym portfelu.</p>`:""}
   ${c.miss.length?`<p class="bad">Brak kursu lub przelicznika waluty dla: ${c.miss.map(esc).join(", ")}. Te pozycje nie są wliczone do wartości ani wyniku.</p>`:""}
   ${c.neg.length?`<p class="bad">Sprzedano więcej niż kupiono: ${c.neg.map(esc).join(", ")}. Sprawdź historię ruchów.</p>`:""}</div>`;
  const posHtml=c.open.length?c.open.map(x=>{const op=ui["pos:"+x.sym],xs=S.tx.filter(t=>t.pid===p.id&&t.sym===x.sym).sort(desc);
    return `<div><button class="item" data-tog="pos:${esc(x.sym)}"><span>${esc(nm(x.sym))} ${op?"▲":"▼"}<br><span class="mu">${esc(x.sym)}, ${fq(x.qty)} × śr. ${money(x.avg,cur)}${x.ccy!==cur?` (${money(x.avgX,x.ccy)})`:""}</span></span><span style="text-align:right">${x.value==null?`<span class="mu">brak kursu</span>`:`<b>${money(x.value,cur)}</b><br>${sg(x.gain,cur)} (${pct(x.cost>0?x.gain/x.cost:NaN)})`}</span></button>
     ${op?`<div class="sub">${x.value!=null&&x.cost>0&&x.first?retRows(x.gain/x.cost,x.first,"Stopa zwrotu pozycji"):""}<button data-addtx="${esc(x.sym)}" style="width:100%;margin:6px 0">+ Dodaj ruch na ${esc(nm(x.sym))}</button>${xs.map(txItem).join("")}</div>`:""}</div>`}).join(""):`<p class="mu">Brak otwartych pozycji. Dodaj pierwszy zakup przyciskiem u góry.</p>`;
  const allTx=S.tx.filter(t=>t.pid===p.id).sort(desc);
  const histCard=allTx.length?`<button class="ghost" data-tog="hist" style="width:100%;margin-bottom:12px">Historia ruchów (${allTx.length}) ${ui.hist?"▲":"▼"}</button>${ui.hist?`<div class="card">${allTx.map(txItem).join("")}</div>`:""}`:"";
  const e=S.tx.find(x=>x.id===txEdit)||{type:"buy",date:today(),sym:txSym,qty:"",price:"",fee:"",amount:"",fx:"",mg:"",tot:""};
  const cash=e.type==="div"||e.type==="fee",v=x=>x===""||x==null||x===0?"":String(x).replace(".",","),X=ccyOf(e.sym)||cur,diff=X!==cur;
  const list=Object.keys(quotes).filter(k=>!/^CURRENCY:|^PPK/i.test(k)).sort((a,b)=>nm(a).localeCompare(nm(b)));
  if(e.sym&&!list.includes(e.sym))list.unshift(e.sym);
  const rtNow=diff&&rt(X)&&rt(cur)?Math.round(rt(X)/rt(cur)*1e4)/1e4:"";
  const txForm=`<div class="card"><b>${txEdit?"Edytuj ruch":"Dodaj ruch"}</b><p class="mu">Portfel w ${esc(cur)}. Data może być wsteczna.</p>
   <div class="g2"><div><label>Rodzaj</label><select id="t-type">${Object.keys(TL).map(k=>`<option value="${k}"${k===e.type?" selected":""}>${TL[k]}</option>`).join("")}</select></div>
   <div><label>Data</label><input id="t-date" type="date" value="${esc(e.date)}"></div></div>
   <label>Papier</label><select id="t-sym"><option value="">${e.type==="fee"?"(opłata całego portfela)":"wybierz papier"}</option>${list.map(k=>`<option value="${esc(k)}"${k===e.sym?" selected":""}>${esc(nm(k))} (${esc(k)})</option>`).join("")}</select>
   <div id="t-trade" style="display:${cash?"none":""}"><div class="g2"><div><label>Ilość</label><input id="t-qty" inputmode="decimal" value="${v(e.qty)}"></div><div><label id="t-pl">Cena za sztukę (${esc(X)})</label><input id="t-price" inputmode="decimal" value="${v(e.price)}"></div></div>
   <div id="t-fxbox" style="display:${diff&&!cash?"":"none"}"><div class="g2"><div><label id="t-fxl">Kurs ${esc(X)}/${esc(cur)} z dnia ruchu</label><input id="t-fx" inputmode="decimal" placeholder="${rtNow?"dziś "+String(rtNow).replace(".",","):""}" value="${v(e.fx&&Math.abs(e.fx-1)>1e-7?e.fx:"")}"></div>
   <div><label>Marża wymiany (%)</label><input id="t-mg" inputmode="decimal" value="${v(e.mg)}"></div></div>
   <label>Kwota w ${esc(cur)} (opcjonalnie, zamiast przeliczania)</label><input id="t-tot" inputmode="decimal" value="${v(e.tot)}"><p class="mu" id="t-prev"></p></div>
   <label>Prowizja w ${esc(cur)} (opcjonalnie)</label><input id="t-fee" inputmode="decimal" value="${v(e.fee)}"></div>
   <div id="t-cash" style="display:${cash?"":"none"}"><label>Kwota w ${esc(cur)} (dywidenda netto albo opłata)</label><input id="t-amount" inputmode="decimal" value="${v(e.amount)}"></div>
   <button data-txsave style="width:100%">Zapisz ruch</button>${txEdit?`<p><button class="danger" data-txdel>Usuń ten ruch</button></p>`:""}</div>`;
  return top+depList()+sel+head+`<div class="card"><b>Pozycje</b>${posHtml}</div>`+histCard+`<p><button class="danger" data-delpf>Usuń ten portfel</button></p>`+mod+(modal==="tx"?sheet(txForm):"")}

document.addEventListener("change",e=>{
  if(e.target.matches("[data-pfsel]")){pid=e.target.value;txEdit=null;render()}
  if(e.target.id==="t-type"){const c=e.target.value==="div"||e.target.value==="fee";$("#t-trade").style.display=c?"none":"";$("#t-cash").style.display=c?"":"none"}});

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-pfgo],[data-addpf],[data-delpf],[data-txsave],[data-txedit],[data-txdel],[data-txcancel]");if(!t)return;const d=t.dataset;
  if(d.pfgo){pid=d.pfgo;txEdit=null;render()}
  else if("addpf" in d){const name=$("#p-name").value.trim();if(!name){alert("Wpisz nazwę portfela.");return}
    const id=String(Date.now());S.pf=[...S.pf,{id,name,owner:$("#p-owner").value,cur:$("#p-cur").value}];pid=id;save()}
  else if("delpf" in d){if(S.tx.some(x=>x.pid===pid)){alert("Ten portfel ma ruchy. Najpierw usuń je z historii.");return}
    if(confirm("Usunąć ten pusty portfel?")){S.pf=S.pf.filter(x=>x.id!==pid);pid="all";save()}}
  else if(d.txedit){txEdit=d.txedit;modal="tx";render()}
  else if("txcancel" in d){txEdit=null;render()}
  else if("txdel" in d){if(confirm("Usunąć ten ruch?")){S.tx=S.tx.filter(x=>x.id!==txEdit);txEdit=null;save()}}
  else if("txsave" in d){
    const type=$("#t-type").value,date=$("#t-date").value,sym=$("#t-sym").value.trim().toUpperCase(),pf=S.pf.find(x=>x.id===pid),cur=pf.cur;
    const qty=num($("#t-qty").value),price=num($("#t-price").value),fee=num($("#t-fee").value)||0,amount=num($("#t-amount").value);
    const fx=num($("#t-fx").value),mg=num($("#t-mg").value)||0,tot=num($("#t-tot").value);
    const trade=type==="buy"||type==="sell",X=ccyOf(sym),diff=!!X&&X!==cur;
    if(!date||((trade||type==="div")&&!sym)||(trade&&!(qty>0&&price>=0))||(!trade&&!(amount>0))){alert("Uzupełnij datę, papier oraz ilość i cenę (zakup, sprzedaż) albo kwotę (dywidenda, opłata).");return}
    if(trade&&diff&&!(fx>0||tot>0)){alert("Ten papier jest w "+X+", a portfel w "+cur+". Podaj kurs "+X+"/"+cur+" z dnia ruchu albo całkowitą kwotę w "+cur+".");return}
    const rec={id:txEdit||String(Date.now()),pid,type,date,sym,qty:trade?qty:0,price:trade?price:0,fee:trade?fee:0,amount:trade?0:amount,fx:trade&&diff&&fx>0?fx:1,mg:trade&&diff?mg:0,tot:trade&&diff&&tot>0?tot:0};
    S.tx=txEdit?S.tx.map(x=>x.id===txEdit?rec:x):[...S.tx,rec];txEdit=null;save()}});

const BT={EDO:{y:10,cap:1,infl:1,fee:3},ROD:{y:12,cap:1,infl:1,fee:3},COI:{y:4,cap:0,infl:1,fee:2},ROS:{y:6,cap:0,infl:1,fee:2},TOS:{y:3,cap:1,infl:0,fee:1},DOR:{y:2,cap:0,infl:0,fee:0.7,mon:1},ROR:{y:1,cap:0,infl:0,fee:0.5,mon:1},OTS:{y:0.25,cap:0,infl:0,fee:0}};
const dAddM=(x,m)=>{const d=D(x);d.setMonth(d.getMonth()+m);return d};
const LAG=2,SRC={own:"Moje",emp:"Pracodawca",state:"Państwo"};
let bEdit=null,peEdit=null;
const D=x=>new Date(x+"T00:00:00");
const dAdd=(x,y)=>{const d=D(x);d.setFullYear(d.getFullYear()+y);return d};
const mk=d=>{const m=new Date(d.getFullYear(),d.getMonth()-LAG,1);return m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")};
const dd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fp=r=>String(Math.round(r*100)/100).replace(".",",")+"%";
const vv=x=>x===""||x==null?"":String(x).replace(".",",");
const inflOf=k=>{const x=S.infl.find(i=>i.m===k);return x?x.v:null};

const ann=(r,from)=>{const n=(D(today())-D(from))/864e5;return n>=365&&1+r>0?Math.pow(1+r,365/n)-1:NaN};
const tile=(l,v,cls,sub)=>`<div class="mt"><div class="ml">${l}</div><div class="mv ${cls||""}">${v}</div>${sub?`<div class="ms">${sub}</div>`:""}</div>`;
const tiles=a=>`<div class="mts">${a.join("")}</div>`;
const retRows=(r,from,label,an,lead)=>tiles([lead||"",tile((label||"Stopa zwrotu")+` <span class="mu">(od ${esc(from)})</span>`,pct(r)),tile("Średniorocznie",pct(an===undefined?ann(r,from):an))].filter(Boolean));
function payDates(b){const M=Math.round(b.years*12),ty=BT[b.type]||{},out=[];if(b.cap)return out;
  if(ty.mon){for(let n=1;n<=M;n++)out.push(dAddM(b.date,n))}
  else if(M<12)out.push(dAddM(b.date,M));else for(let k=1;k*12<=M;k++)out.push(dAddM(b.date,12*k));
  return out}
function lastPast(b){const now=D(today());let r=D(b.date);for(const d of payDates(b)){if(d<=now)r=d;else break}return r}
function payDue(b){const paid=b.paid?D(b.paid):lastPast(b);return payDates(b).find(d=>d>paid)||null}

function bondCalc(b){const now=D(today()),P=100*b.qty,M=Math.round(b.years*12),end=dAddM(b.date,M),matured=end<=now,inf=b.infl!==false,ty=BT[b.type]||{};
  let C=P,acc=0,nextPay=null,sr=0;const rates=[],miss=[],el=Math.max((Math.min(now,end)-D(b.date))/864e5,0);
  if(ty.mon){let n=0;while(n<M&&dAddM(b.date,n+1)<=now)n++;
    if(!matured){acc=P*b.r1/100*((now-dAddM(b.date,n))/864e5)/365;nextPay=dAddM(b.date,n+1)}rates.push(b.r1);sr=b.r1*el/365}
  else for(let k=0;k*12<M;k++){const st=dAddM(b.date,12*k);if(st>now)break;
    const ne=dAddM(b.date,12*(k+1)),e=ne<end?ne:end,full=ne<=end;
    let r;if(k===0||!inf)r=b.r1;else{const key=mk(st),c=inflOf(key);if(c==null){miss.push(key);r=b.margin}else r=c+b.margin}
    rates.push(r);const base=b.cap?C:P,yr=base*r/100;
    if(e<=now){if(b.cap)C+=full?yr:yr*((e-st)/864e5)/365;sr+=full?r:r*((e-st)/864e5)/365}
    else{acc=yr*((now-st)/864e5)/365;nextPay=e;sr+=r*((now-st)/864e5)/365}}
  const interest=(b.cap?C-P:0)+acc;
  const fee=matured?0:Math.min((b.fee||0)*b.qty,Math.max(interest,0)),net=b.cap?interest-fee-Math.max(interest-fee,0)*0.19:Math.max(interest,0)*0.81;
  const tot=b.cap?(C+acc-P)/P:sr/100,an=b.cap?ann(tot,b.date):(el>=365?tot/(el/365):NaN);
  return{P,value:(b.cap?C:P)+acc,interest,net,rates,miss,end,matured,nextPay,tot,an}}

function bondTotals(){let value=0,invested=0,interest=0,invOwn=0,firstOwn="";const by={};
  for(const b of S.bonds){const c=bondCalc(b);if(c.matured)continue;value+=c.value;invested+=c.P;interest+=c.interest;by[b.owner]=(by[b.owner]||0)+c.value;
    if(!b.reinv){invOwn+=c.P;if(!firstOwn||b.date<firstOwn)firstOwn=b.date}}
  return{value,invested,interest,invOwn,firstOwn,by}}

      <button class="ghost" data-bedit="${esc(b.id)}" style="width:100%;margin:6px 0">Edytuj</button></div>`:""}</div>`}).join(""):`<p class="mu">Nie ma jeszcze obligacji.</p>`;

   <div class="g2"><div><label>Rodzaj</label><select id="b-type">${Object.keys(BT).map(k=>`<option${k===e.type?" selected":""}>${k}</option>`).join("")}</select></div>

   <button data-bsave style="width:100%">Zapisz</button>${bEdit?`<p><button class="danger" data-bdel>Usuń obligacje</button></p>`:""}</div>`;

const ppkQ=()=>{if(quotes.PPK)return quotes.PPK;const k=Object.keys(quotes).find(x=>/^PPK/i.test(x.trim())||/^PPK/i.test(String(quotes[x].name).trim()));return k?quotes[k]:null};
function ppkCalc(){const P=S.ppk,q=ppkQ(),auto=!!(q&&q.price>0),price=auto&&!P.override?q.price:(P.price||0),src={own:{u:0,c:0},emp:{u:0,c:0},state:{u:0,c:0}};
  let first=P.first||"";
  for(const e of P.e){const s=src[e.src];if(s){s.u+=e.units;s.c+=e.amount}if(!P.first&&(!first||e.date<first))first=e.date}
  let units=0,contrib=0;for(const k in src){const s=src[k];s.v=s.u*price;units+=s.u;contrib+=s.c}
  const value=units*price,o=src.own,m=src.emp;
  const ownTax=Math.max(o.v-o.c,0)*0.19,empRet=0.7*m.v,empTax=Math.max(0.7*(m.v-m.c),0)*0.19;
  const gain=value-contrib;
  return{src,units,contrib,value,price,auto,q,first,gain,ret:contrib>0?gain/contrib:NaN,ownNet:o.v-ownTax,empNet:empRet-empTax,zus:0.3*m.v,fp:src.state.v,net:o.v-ownTax+empRet-empTax}}

function viewPpk(){const P=S.ppk,c=ppkCalc(),fr=c.first||today();
  const sm=r=>`<div class="mu" style="font-size:12px">${pct(r)} całościowo, rocznie ${pct(ann(r,fr))}</div>`;
  const vr=c.contrib>0?(c.value-c.contrib)/c.contrib:NaN,wr=c.src.own.c>0?(c.net-c.src.own.c)/c.src.own.c:NaN;
  const hint=P.override?"Kurs ustawiony ręcznie.":c.auto?"Kurs z arkusza (automatyczny).":c.q?`W arkuszu jest wiersz „${esc(c.q.sym)}”, ale kurs to „${esc(c.q.raw)}”, a nie liczba.`:"Nie widzę w arkuszu wiersza PPK (w kolumnie A musi być PPK). Wpisz kurs ręcznie.";
  const top=`<div class="card"><div class="mts two">${tile("Wartość PPK",money(c.value,"PLN"),"",sm(vr))}${tile("Wypłata dziś",money(c.net,"PLN"),"good",sm(wr))}</div>
   <button class="ghost" data-tog="ppcalc" style="width:100%;margin-top:8px">Szczegóły wypłaty ${ui.ppcalc?"▲":"▼"}</button>
   ${ui.ppcalc?`<div class="row"><span>Moje wpłaty i zysk, minus 19% od zysku</span><b>${money(c.ownNet,"PLN")}</b></div>
   <div class="row"><span>Pracodawca: 70% środków, minus podatek</span><b>${money(c.empNet,"PLN")}</b></div>
   <div class="row"><span>Państwo</span><b>${money(0,"PLN")}</b></div>
   <div class="row"><span class="mu">30% środków pracodawcy trafia do ZUS</span><span class="mu">${money(c.zus,"PLN")}</span></div>
   <div class="row"><span class="mu">Dopłaty państwa wracają do Funduszu Pracy</span><span class="mu">${money(c.fp,"PLN")}</span></div>
   <p class="mu">Szacunek wg zasad, które sprawdziłem w źródłach (100% moich wpłat, 70% pracodawcy, 0% państwa, 19% podatku od zysku). Sposób liczenia podstawy podatku porównaj z kalkulatorem PZU przed jakąkolwiek decyzją.</p>`:""}
   ${tiles([tile("Wpłacono razem",money(c.contrib,"PLN")),tile("Jednostki",fq(c.units)),tile("Wynik funduszu",sg(c.gain,"PLN"),"",`${pct(c.ret)} całościowo, rocznie ${pct(ann(c.ret,fr))}`)])}
   <div style="margin-top:10px"><div class="g2"><div><label>Nazwa funduszu</label><input id="pp-fund" value="${esc(P.fund||"")}" placeholder="nazwa funduszu"></div>
   <div><label>Kurs jednostki (zł)</label><input id="pp-price" inputmode="decimal" value="${vv(c.price||"")}"></div></div>
   <p class="mu" style="margin:0 0 8px">${hint}</p>
   <button data-ppsave>Zapisz</button>${P.override&&c.auto?` <button class="ghost" data-ppauto>Wróć do kursu z arkusza</button>`:""}
   <p><a href="https://www.analizy.pl/fundusze-ppk/PZU59/ppk-inpzu-2055" target="_blank" rel="noopener" style="color:var(--ac)">Sprawdź kurs na analizy.pl</a></p></div></div>`;
  const srcBlock=k=>{const q=c.src[k],ed=ui["ppe:"+k];return `<div class="card"><b>${SRC[k]}</b>
   ${tiles([tile("Suma wpłat",money(q.c,"PLN")),tile("Jednostki",fq(q.u)),tile("Wartość",money(q.v,"PLN"))])}
   <div class="g2"><div><label>Kolejna wpłata (zł, minus = odejmij)</label><input id="pa-${k}-a" autocomplete="off"></div><div><label>Ilość jednostek</label><input id="pa-${k}-u" autocomplete="off"></div></div>
   <button data-ppadd="${k}" style="width:100%">Potwierdź</button>
   <button class="ghost" data-tog="ppe:${k}" style="width:100%;margin-top:8px">Edytuj sumy ${ed?"▲":"▼"}</button>
   ${ed?`<div class="g2"><div><label>Suma wpłat (zł)</label><input id="pe-${k}-a" value="${vv(Math.round(q.c*100)/100)}"></div><div><label>Jednostki</label><input id="pe-${k}-u" value="${vv(Math.round(q.u*1e6)/1e6)}"></div></div><button data-ppesave="${k}" style="width:100%">Zapisz sumy</button>`:""}</div>`};
  const first=`<div class="card"><label>Data pierwszej wpłaty</label><div class="g2"><input id="pp-first" type="date" value="${esc(c.first||"")}"><button data-ppfirst>Zapisz datę</button></div></div>`;
  return top+`<button class="ghost" data-tog="ppdep" style="width:100%;margin-bottom:12px">Wpłaty wg źródła ${ui.ppdep?"▲":"▼"}</button>`+(ui.ppdep?first+Object.keys(SRC).map(srcBlock).join(""):"")}

  else if(d.bpaid){const b=S.bonds.find(x=>x.id===d.bpaid),due=b&&payDue(b);if(due){b.paid=dd(due);S.bonds=[...S.bonds];save()}}
  else if(d.ppfirst!==undefined){S.ppk={...S.ppk,first:$("#pp-first").value};save()}
  else if(d.ppadd){const k=d.ppadd,a=num($("#pa-"+k+"-a").value),u=num($("#pa-"+k+"-u").value);
    if(!a||!u){alert("Wpisz kwotę i ilość jednostek (kwota z minusem odejmuje wpłatę).");return}
    S.ppk={...S.ppk,e:[...S.ppk.e,{id:String(Date.now()),date:today(),src:k,amount:a,units:Math.abs(u)*Math.sign(a)}]};save()}
  else if(d.ppesave){const k=d.ppesave,a=num($("#pe-"+k+"-a").value),u=num($("#pe-"+k+"-u").value);
    if(!(a>=0)||!(u>=0)){alert("Wpisz sumę wpłat i jednostek (zero lub więcej).");return}
    const old=S.ppk.e.filter(x=>x.src===k),dt=old.length?old.map(x=>x.date).sort()[0]:today();
    S.ppk={...S.ppk,e:[...S.ppk.e.filter(x=>x.src!==k),...(a>0||u>0?[{id:String(Date.now()),date:dt,src:k,amount:a,units:u}]:[])]};save()}});

document.addEventListener("change",e=>{if(e.target.id==="d-cur"){const cu=e.target.value;$("#d-fxbox").style.display=cu!=="PLN"?"":"none";$("#d-fxl").textContent="Kurs z dnia wpłaty (PLN za 1 "+cu+")"}});

function ccyBreakdown(){const m={},add=(c,v)=>{if(v>0)m[c]=(m[c]||0)+v};
  for(const a of S.accounts){const r=rates[a.cur];if(r)add(a.cur,a.amount*r)}
  for(const p of S.pf){const c=calc(p);if(!c.f)continue;add(p.cur,c.value*c.f)}
  add("PLN",bondTotals().value);add("PLN",ppkCalc().value);
  return Object.entries(m).sort((a,b)=>b[1]-a[1])}

let locked=false,lockIn="",lockMsg="",lockMode="",hiddenAt=0;
const pinCfg=()=>{try{return JSON.parse(localStorage.getItem("pin"))}catch(e){return null}};
const pinFail=()=>{try{return JSON.parse(localStorage.getItem("pinf"))||{}}catch(e){return {}}};
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function pinHash(pin,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]);return b64(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:150000},k,256))}
async function pinCheck(pin,c){return (await pinHash(pin,unb64(c.s)))===c.h}
function drawLock(){const el=$("#lock");if(!el)return;if(!locked){el.innerHTML="";el.style.display="none";return}
  const c=pinCfg();if(!c){locked=false;el.style.display="none";return}
  el.style.display="flex";
  if(lockMode==="forgot"){el.innerHTML=`<div class="lk" style="text-align:left"><h1 style="text-align:center">Portfel</h1><p class="mu">Podaj hasło konta aplikacji, żeby wyłączyć lub zmienić PIN na tym urządzeniu.</p>
   <label>Hasło konta</label><input id="fg-pass" type="password" autocomplete="current-password">
   <label>Nowy PIN (4 do 6 cyfr), jeśli chcesz go zmienić</label><input id="fg-new" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
   <label>Powtórz nowy PIN</label><input id="fg-new2" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
   <p class="bad" id="fg-msg" style="min-height:20px">${esc(lockMsg)}</p>
   <button data-fgnew style="width:100%">Ustaw nowy PIN</button><p><button class="danger" data-fgoff style="width:100%">Wyłącz PIN</button></p><button class="ghost" data-fgback style="width:100%">Wróć</button></div>`;return}
  el.innerHTML=`<div class="lk"><h1>Portfel</h1><p class="mu" style="min-height:22px">${esc(lockMsg||"Wpisz PIN")}</p>
   <div class="dots">${Array.from({length:c.n},(_,i)=>`<i class="${i<lockIn.length?"f":""}"></i>`).join("")}</div>
   <div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button class="sm" data-kf>Nie pamiętam PIN-u</button><button data-k="0">0</button><button data-kb aria-label="Usuń cyfrę">⌫</button></div></div>`}
function lockNow(){if(!pinCfg())return;locked=true;lockIn="";lockMsg="";drawLock()}
async function pinKey(d){const c=pinCfg();if(!c||!locked||lockMode)return;const f=pinFail();
  if(f.until>Date.now()){lockMsg="Spróbuj za "+Math.ceil((f.until-Date.now())/1000)+" s";drawLock();return}
  if(lockIn.length>=c.n)return;lockIn+=d;lockMsg="";drawLock();
  if(lockIn.length===c.n){let ok=false;try{ok=await pinCheck(lockIn,c)}catch(e){}
    if(ok){locked=false;lockIn="";lockMsg="";localStorage.removeItem("pinf");drawLock();return}
    const n=(f.c||0)+1;lockIn="";
    if(n>=10){localStorage.removeItem("pin");localStorage.removeItem("pinf");locked=false;drawLock();signOut(auth);alert("Zbyt wiele błędnych prób. Wylogowano, zaloguj się hasłem konta.");return}
    localStorage.setItem("pinf",JSON.stringify({c:n,until:n>=5?Date.now()+30000:0}));
    lockMsg=n>=5?"Błędny PIN. Odczekaj 30 s":"Błędny PIN";drawLock()}}
async function pinReset(mode){const msg=t=>{const m=$("#fg-msg");if(m)m.textContent=t};
  const pass=$("#fg-pass").value;if(!pass){msg("Wpisz hasło konta.");return}
  let np=null;
  if(mode==="new"){if(!(window.crypto&&crypto.subtle)){msg("Ta przeglądarka nie obsługuje PIN-u (wymaga https).");return}
    const a=$("#fg-new").value,b=$("#fg-new2").value;if(!/^\d{4,6}$/.test(a)){msg("PIN musi mieć od 4 do 6 cyfr.");return}if(a!==b){msg("PIN-y się różnią.");return}np=a}
  try{await signInWithEmailAndPassword(auth,(auth.currentUser&&auth.currentUser.email)||EMAIL,pass)}
  catch(e){msg(["auth/invalid-credential","auth/wrong-password"].includes(e.code)?"Błędne hasło konta.":"Nie udało się sprawdzić hasła ("+e.code+").");return}
  if(np){const salt=crypto.getRandomValues(new Uint8Array(16));localStorage.setItem("pin",JSON.stringify({s:b64(salt),h:await pinHash(np,salt),n:np.length}))}else localStorage.removeItem("pin");
  localStorage.removeItem("pinf");lockMode="";locked=false;lockIn="";lockMsg="";drawLock();render()}
function pinForm(){const c=pinCfg();return `<div class="card"><b>${c?"Zmień lub wyłącz PIN":"Ustaw PIN"}</b><p class="mu">PIN działa tylko na tym urządzeniu i blokuje wejście do aplikacji. Dane w chmurze chroni hasło konta.</p>
   ${c?`<label>Obecny PIN</label><input id="pn-old" type="password" inputmode="numeric" maxlength="6" autocomplete="off">`:""}
   <label>Nowy PIN (4 do 6 cyfr)</label><input id="pn-new" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
   <label>Powtórz nowy PIN</label><input id="pn-new2" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
   <button data-pinsave style="width:100%">Zapisz PIN</button>${c?`<p><button class="danger" data-pinoff>Wyłącz PIN</button></p>`:""}</div>`}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-k],[data-kb],[data-kf],[data-pinsave],[data-pinoff],[data-fgnew],[data-fgoff],[data-fgback]");if(!t)return;const d=t.dataset;
  if(d.k!==undefined)pinKey(d.k);
  else if("kb" in d){lockIn=lockIn.slice(0,-1);drawLock()}
  else if("kf" in d){lockMode="forgot";lockMsg="";drawLock()}
  else if("fgback" in d){lockMode="";lockMsg="";drawLock()}
  else if("fgnew" in d)pinReset("new");
  else if("fgoff" in d)pinReset("off");
  else if("pinsave" in d||"pinoff" in d){
    if(!(window.crypto&&crypto.subtle)){alert("Ta przeglądarka nie obsługuje PIN-u (wymaga połączenia https).");return}
    const c=pinCfg();
    if(c){let ok=false;try{ok=await pinCheck($("#pn-old").value,c)}catch(x){}if(!ok){alert("Obecny PIN jest błędny.");return}}
    if("pinoff" in d){localStorage.removeItem("pin");localStorage.removeItem("pinf");modal=null;render();alert("PIN wyłączony.");return}
    const a=$("#pn-new").value,b=$("#pn-new2").value;
    if(!/^\d{4,6}$/.test(a)){alert("PIN musi mieć od 4 do 6 cyfr.");return}
    if(a!==b){alert("PIN-y się różnią.");return}
    const salt=crypto.getRandomValues(new Uint8Array(16));
    localStorage.setItem("pin",JSON.stringify({s:b64(salt),h:await pinHash(a,salt),n:a.length}));localStorage.removeItem("pinf");
    modal=null;render();alert("PIN ustawiony.")}});
document.addEventListener("keydown",e=>{if(!locked||lockMode)return;if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==="Backspace"){lockIn=lockIn.slice(0,-1);drawLock()}});
document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else if(pinCfg()&&user&&hiddenAt&&Date.now()-hiddenAt>60000)lockNow()});
if(pinCfg())lockNow();

const readText=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=()=>rej(r.error);r.readAsText(f)});
function bakDownload(name){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({...S,_meta:{app:"portfel",at:new Date().toISOString()}},null,1)],{type:"application/json"}));a.download=name;a.click()}
async function restoreFile(f){if(!f)return;let o;
  try{o=JSON.parse(await readText(f))}catch(x){alert("To nie jest poprawny plik kopii (JSON).");return}
  if(!o||typeof o!=="object"||!["accounts","pf","tx","bonds","dep","ppk"].some(k=>k in o)){alert("W pliku nie widzę danych portfela.");return}
  const A=k=>Array.isArray(o[k])?o[k]:[];
  const st={accounts:A("accounts"),pf:A("pf"),tx:A("tx"),bonds:A("bonds"),infl:A("infl"),dep:A("dep"),ppk:Object.assign({price:0,pdate:"",fund:"",first:"",override:false,e:[]},o.ppk&&typeof o.ppk==="object"?o.ppk:{})};
  if(!Array.isArray(st.ppk.e))st.ppk.e=[];
  if(!confirm("Przywrócić dane z pliku? To ZASTĄPI wszystkie obecne dane.\n\nW pliku: konta "+st.accounts.length+", portfele "+st.pf.length+", ruchy "+st.tx.length+", obligacje "+st.bonds.length+", wpłaty do akcji "+st.dep.length+", wpłaty PPK "+st.ppk.e.length+".\n\nPrzed przywróceniem pobiorę kopię obecnych danych."))return;
  bakDownload("portfel-przed-przywroceniem-"+today()+".json");
  try{await setDoc(doc(db,"data","state"),st);modal=null;alert("Dane przywrócone.")}catch(x){alert("Nie udało się zapisać danych: "+(x.code||x.message))}}
document.addEventListener("change",e=>{if(e.target.id==="rs-file"){const f=e.target.files[0];e.target.value="";restoreFile(f)}});

function viewSoon(n){return `<div class="card"><b>${n}</b><p class="mu">Ten dział dodamy w następnym kroku.</p></div>`}

function render(){const app=$("#app");
  if(!booted){app.innerHTML=`<p class="mu" style="padding:24px">Ładowanie…</p>`;return}
  if(!user){app.innerHTML=`<form class="login" id="lf"><h1>Portfel</h1><p class="mu">Zaloguj się wspólnym kontem aplikacji.</p>
    <label>E-mail</label><input id="l-mail" type="email" value="${EMAIL}" autocomplete="username">
    <label>Hasło</label><input id="l-pass" type="password" autocomplete="current-password">
    ${loginErr?`<p class="bad">${esc(loginErr)}</p>`:""}<button type="submit" style="width:100%">Zaloguj</button></form>`;return}
  const body=tab==="all"?viewAll():tab==="sav"?viewSav():tab==="stk"?viewStk():tab==="bnd"?viewBnd():viewPpk();
  app.innerHTML=`<header><h1>Portfel</h1><div class="nv">${NAV.map(([k,n,i])=>`<button class="ib${k===tab?" on":""}" data-tab="${k}" title="${n}" aria-label="${n}">${i}</button>`).join("")}</div></header>
   <div class="st">${tab==="all"?esc(info):""}${err?` <span class="bad">${esc(err)}</span>`:""}</div><main>${body}</main>`}

document.addEventListener("submit",async e=>{
  if(e.target.id!=="lf")return;e.preventDefault();loginErr="";
  try{await signInWithEmailAndPassword(auth,$("#l-mail").value.trim(),$("#l-pass").value)}
  catch(x){loginErr=["auth/invalid-credential","auth/wrong-password","auth/user-not-found"].includes(x.code)?"Błędny e-mail lub hasło.":"Nie udało się zalogować ("+x.code+").";render()}});

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-edit],[data-save],[data-cancel],[data-del],[data-out]");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;editId=null;modal=null;render()}
  else if(t.dataset.edit){editId=t.dataset.edit;modal="acc";render()}
  else if("cancel" in t.dataset){editId=null;render()}
  else if("out" in t.dataset){signOut(auth)}
  else if("del" in t.dataset){if(confirm("Usunąć to konto z listy?")){S.accounts=S.accounts.filter(x=>x.id!==editId);editId=null;save()}}
  else if("save" in t.dataset){
    const name=$("#f-name").value.trim(),cur=$("#f-cur").value.trim().toUpperCase(),amount=num($("#f-amount").value);
    if(!name||cur.length!==3||isNaN(amount)){alert("Uzupełnij nazwę, trzyliterową walutę (np. PLN) i saldo.");return}
    const rec={id:editId||String(Date.now()),name,owner:$("#f-owner").value,cur,amount};
    S.accounts=editId?S.accounts.map(x=>x.id===editId?rec:x):[...S.accounts,rec];editId=null;save()}});

onAuthStateChanged(auth,u=>{user=u;booted=true;if(!u&&locked){locked=false;drawLock()}
  if(unsub){unsub();unsub=null}
  if(u){
    unsub=onSnapshot(doc(db,"data","state"),s=>{S=s.exists()?s.data():{accounts:[]};S.accounts=S.accounts||[];S.pf=S.pf||[];S.tx=S.tx||[];S.bonds=S.bonds||[];S.dep=S.dep||[];S.infl=S.infl||[];S.ppk=Object.assign({price:0,pdate:"",fund:"",first:"",override:false,e:[]},S.ppk||{});const ow=o=>o==="Kuba"?"Jakub":o==="Żona"?"Beata":o;[S.accounts,S.pf,S.bonds].forEach(a=>a.forEach(x=>x.owner=ow(x.owner)));if(S.bonds.some(b=>!b.cap&&!b.paid)){S.bonds.forEach(b=>{if(!b.cap&&!b.paid)b.paid=dd(lastPast(b))});save()}err="";render()},
      e=>{err="Brak dostępu do bazy: "+e.code;render()});
    loadRates()}
  render()});
render();
</script>
